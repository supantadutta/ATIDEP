preamble: Rows are works that build, benchmark, validate or govern part of the path from threat intelligence to
  deployed detection content. Each row was profiled by one reader (the authoring assistant) from search-engine extracts
  or, for the two software projects, from their READMEs; a second, independent reading against the full texts is
  pending. Empirical studies of rule management without a system (Vermeer et al. 2023; Teuwen et al. 2025) and work
  on LLM reliability and prompt injection are discussed in the text, not tabulated. ATIDEP's own row states its
  design, not results; its open-source cell is Partial because the stack is open-source while the repository's public
  release is not yet decided.
