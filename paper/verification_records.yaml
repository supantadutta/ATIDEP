description: 'Verification record for every bibliography entry. The network policy of the authoring environment
  blocks publisher sites, DOI resolution and arXiv, so papers were checked only through search-engine extracts (abstract-level
  or metadata-level). No paper has been checked against its full text: every paper is marked "Full-text verification
  pending". Software and documentation sources hosted on GitHub were read directly.'
