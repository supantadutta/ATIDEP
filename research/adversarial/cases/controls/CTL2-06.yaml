review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 86
    reasoning: The rule parses, the metadata is complete, and the only field, QueryName, is allowed, with
      the allowed 're' modifier. The regex '^[0-9a-f]{20,}\.relay-hub\.example$' has literal runs 'relay-hub'
      and 'example', both in the verbatim quote 'under the zone relay-hub.example'. The tags match the
      table for T1071.004. By hand, the label '9f2a61c0d4e87b35a1c2e7' has 22 hex characters and 'c04d7e91b2a85f36d9e0143a'
      has 24, so both positives match. The look-alikes 'status.relay-hub.example' (not hex) and 'a1b2c3d4e5f6.relay-hub.example'
      (12 characters) fail the regex, as do both negatives. The regex is a long single positive term,
      and none of the 60 baseline DNS names match.
    events_ok: true
    incidental_issues:
    - The report says 'lowercase', but matching is case-insensitive, so uppercase hex labels would also
      match. This is harmless.
    - I could not check whether the Wazuh converter accepts the {20,} quantifier, because that depends
      on the converter implementation, which I did not read.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 90
    reasoning: 'The single regex ''^[0-9a-f]{20,}\.relay-hub\.example$'' on QueryName uses the allowed
      ''re'' modifier, and pySigma parses it. Its literal runs (''relay-hub'', ''example'') occur in the
      verbatim quote ''under the zone relay-hub.example''. I checked the hex labels by hand: the positives
      9f2a61c0d4e87b35a1c2e7 (22 chars) and c04d7e91b2a85f36d9e0143a (24 chars) are all within [0-9a-f]
      and at least 20 long, so both match. The look-alikes status. (non-hex) and a1b2c3d4e5f6 (12 chars)
      fail the pattern, and the negatives are unrelated domains. The pattern is long and specific enough
      for the breadth guard, and the baseline DNS domains do not match. Tags are correct for T1071.004.'
    events_ok: true
    incidental_issues:
    - The rule does not constrain Image, which is fine given the report, but the hex test relies on case-insensitive
      matching, so uppercase hex would also match.
    - Whether Wazuh's regex engine accepts the {20,} quantifier cannot be verified from the contract,
      which lists 're' as allowed.
