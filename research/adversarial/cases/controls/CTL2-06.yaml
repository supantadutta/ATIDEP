id: CTL2-06
role: control
defect_class: NONE
evasive: false
why: 'Complete, valid DNS rule using an anchored regular expression: the literal runs relay-hub and example
  occur in the quoted evidence, T1071.004 is correct, and the pattern requires a 20-or-more character
  hexadecimal label so that short human-readable names and 12-character build identifiers in the same
  zone are not matched. The baseline queries never end in this zone (0 of 400).'
expected_gate: none
report_text: The backdoor tunnels its tasking through DNS. Each beacon looks up a name whose first label
  is a lowercase hexadecimal string of 20 or more characters under the zone relay-hub.example, for example
  9f2a61c0d4e87b35a1c2e7.relay-hub.example. The zone is shared hosting, and legitimate customers use short
  human-readable names such as status.relay-hub.example or build identifiers of about twelve characters.
  In the incident the lookups came from rundll32.exe and from a dropped binary in the Public profile,
  at roughly one query per forty seconds. Hexadecimal labels of this length carry encoded command data
  and are not produced by any browser.
evidence:
- Each beacon looks up a name whose first label is a lowercase hexadecimal string of 20 or more characters
  under the zone relay-hub.example
- for example 9f2a61c0d4e87b35a1c2e7.relay-hub.example
logsource: windows_dns_query
techniques:
- T1071.004
sigma_yaml: |
  title: DNS Tunnelling Hexadecimal Label Under Relay Hub Zone
  id: e6038b1f-7a95-4cd2-8e47-0b5d1a9c3f06
  status: experimental
  description: Detects DNS lookups with a hexadecimal first label of 20 or more characters under relay-hub.example, the encoded tasking channel of the backdoor in the reported intrusion.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.command_and_control
    - attack.t1071.004
  logsource:
