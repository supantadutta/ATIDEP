id: CTL2-02
role: control
defect_class: NONE
evasive: false
why: 'Complete, valid rule with two selections and a not-filter: tool names, ports and the bastion address
  all appear in the quoted evidence, T1090 and T1571 tags match the cited techniques, and the rule matches
  the tunnel connections while excluding the sanctioned bastion and standard-port SSH. SSH clients do
  not appear in the baseline (0 of 400).'
expected_gate: none
report_text: The operator staged plink.exe on the pivot host and used it to build a reverse SSH tunnel
  to the staging server at 203.0.113.88 on port 2222, forwarding RDP back into the victim network. On
  a second host the built-in ssh.exe client was used for the same purpose, this time to port 8022 on 198.51.100.145
  after the first staging server was taken down. Our SSH inventory shows that administrators legitimately
  reach only the bastion host at 192.0.2.10, which listens on port 2222; every other destination on ports
  2222 or 8022 is unsanctioned. Neither tunnel used a standard SSH port, which allowed them to slip past
  a firewall rule that only inspected port 22. Defenders should alert on SSH clients reaching those ports,
  excluding the bastion host.
evidence:
- The operator staged plink.exe on the pivot host and used it to build a reverse SSH tunnel to the staging
  server at 203.0.113.88 on port 2222
- the built-in ssh.exe client was used for the same purpose, this time to port 8022 on 198.51.100.145
- administrators legitimately reach only the bastion host at 192.0.2.10, which listens on port 2222
logsource: windows_network_connection
techniques:
- T1090
- T1571
sigma_yaml: |
  title: SSH Client Connection To Unsanctioned Tunnel Ports
  id: a4e83f17-92cd-4b05-8f6a-31b7d05c9e02
  status: experimental
  description: Detects plink.exe or ssh.exe connecting to TCP port 2222 or 8022 on any host other than the sanctioned bastion at 192.0.2.10, matching the reverse SSH tunnels in the reported intrusion.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.command_and_control
    - attack.t1090
    - attack.t1571
  logsource:
    category: network_connection
    product: windows
  detection:
    selection_tool:
      Image|endswith:
        - '\plink.exe'
        - '\ssh.exe'
    selection_port:
      DestinationPort:
        - '2222'
        - '8022'
    filter_bastion:
      DestinationIp: '192.0.2.10'
    condition: all of selection* and not filter_bastion
  falsepositives:
    - Administrators using a personal jump host that listens on port 2222 or 8022
  level: high
assumptions: []
