id: CTL2-09
role: control
defect_class: NONE
evasive: false
why: 'Complete, valid persistence rule with three selections: schtasks.exe, /create, /sc onlogon and the
  two user-profile path fragments all occur in the quoted evidence, T1053.005 carries the correct v19
  tactic tags, and benign task creation (daily backup, OneDrive logon task from Program Files) and the
  baseline schtasks /query lines are not matched (0 of 400).'
expected_gate: none
report_text: Persistence on the compromised workstation was established with a scheduled task created
  during a hands-on-keyboard session. The operator ran schtasks.exe /create /tn SyncHelper /tr C:\Users\Public\Libraries\sync.exe
  /sc onlogon /ru SYSTEM, so the payload would start at every logon with elevated rights. On a second
  host the same pattern appeared with the binary stored under C:\Users\bob\AppData\Roaming\Zoom\. Routine
  schtasks.exe use in this environment is limited to querying tasks, for example schtasks /query /fo LIST,
  and administrators schedule their own jobs from C:\Scripts. Task creation that runs at logon from a
  user-writable folder has not been seen from administrators.
evidence:
- The operator ran schtasks.exe /create /tn SyncHelper /tr C:\Users\Public\Libraries\sync.exe /sc onlogon
  /ru SYSTEM
- the same pattern appeared with the binary stored under C:\Users\bob\AppData\Roaming\Zoom\
logsource: windows_process_creation
techniques:
- T1053.005
sigma_yaml: |
  title: Logon Scheduled Task Created With Binary In Public Or Roaming Profile
  id: b1c9570e-6d2a-4f83-a07b-4e93d5c18a09
  status: experimental
  description: Detects schtasks.exe creating a logon-triggered task whose command line points into the Public or Roaming user profile folders, the persistence pattern seen in the reported intrusion.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1053.005
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: '\schtasks.exe'
    selection_create:
      CommandLine|contains|all:
        - '/create'
        - '/sc onlogon'
    selection_path:
      CommandLine|contains:
        - '\Users\Public\'
        - '\AppData\Roaming\'
    condition: all of selection*
  falsepositives:
    - Software that registers a logon task from the Public or Roaming profile folders during a per-user install
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks.exe /create /tn SyncHelper /tr C:\Users\Public\Libraries\sync.exe /sc onlogon /ru SYSTEM
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /create /tn ZoomUpdater /tr C:\Users\bob\AppData\Roaming\Zoom\zoomupd.exe /sc ONLOGON
      /f
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /create /sc onlogon /tn Spooler2 /tr C:\Users\Public\Documents\spool.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\carol
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\tasklist.exe
    cmd: tasklist /v
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\whoami.exe
    cmd: whoami
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /create /tn BackupNightly /tr C:\Scripts\backup.ps1 /sc daily /st 02:00
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\admin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /create /tn OneDriveStartup /tr C:\Program Files\Microsoft OneDrive\OneDrive.exe /sc
      onlogon
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\admin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /query /fo LIST
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 90
    reasoning: 'The rule parses and has complete metadata, with fields Image and CommandLine and modifiers
      endswith, contains and all. The tags are exactly the four required for T1053.005 (execution, persistence,
      privilege_escalation, t1053.005). Quotes 1 and 2 are verbatim and cover schtasks.exe, /create, ''/sc
      onlogon'', ''\Users\Public\'' and ''\AppData\Roaming\''. I checked all 3 positives: each has Image
      schtasks.exe, /create, ''/sc onlogon'' (the second as uppercase /sc ONLOGON, matched case-insensitively)
      and a Public or Roaming path, so all match. The tasklist and whoami negatives fail Image. Of the
      look-alikes, the daily C:\Scripts task lacks onlogon, the OneDrive logon task (Program Files path)
      fails the path selection, and /query lacks /create, so none match. Baseline schtasks activity is
      /query, so about 0 matches.'
    events_ok: true
    incidental_issues:
    - schtasks also accepts '-' as the switch prefix, and the rule matches only '/create' and '/sc onlogon'.
      This is a minor recall gap, not part of the claimed checks.
    - The OneDrive look-alike command line has an unquoted path with spaces, which is slightly unrealistic
      but harmless.
    - Level high is on the strong side given the declared false-positive source, but it is defensible.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 90
    reasoning: 'The rule parses and the tags match the T1053.005 row exactly. Evidence covers every discriminating
      value: schtasks.exe, /create and /sc onlogon in quote 1, ''\Users\Public\'' in quote 1''s path,
      and ''\AppData\Roaming\'' in quote 2''s path. Both quotes are verbatim in the report. The 3 positives
      match; the ZoomUpdater one matches through case-insensitive ''ONLOGON'' plus ''\AppData\Roaming\'',
      and the Spooler2 one through Public\Documents. The tasklist and whoami negatives fail the Image
      test. The /sc daily C:\Scripts look-alike lacks onlogon, the OneDrive logon task under Program Files
      lacks the Public or Roaming path, and the /query look-alike lacks /create. The baseline schtasks
      activity is only /query, so there are 0 matches.'
    events_ok: true
    incidental_issues:
    - schtasks.exe also accepts '-' switches and the rule has no windash. The report shows only slash
      forms, so this is a minor evasion gap, not a defect against the evidence.
    - Both path values end in a backslash. pySigma keeps them as literal text, but other converters could
      treat the trailing backslash as an escape.
