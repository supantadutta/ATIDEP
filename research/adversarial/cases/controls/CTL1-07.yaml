id: CTL1-07
role: control
defect_class: NONE
evasive: false
why: 'Correct rule: tag T1047 is valid, wmic.exe, the words process call create and hdtools.exe are all
  quoted in the evidence, the regex tolerates spacing variation, and the ''not'' filter removes only the
  documented helpdesk toolkit, so wmic process listing and the toolkit look-alike do not match.'
expected_gate: none
report_text: Lateral movement from the compromised file server relied on WMI process creation. The operator
  ran wmic.exe /node:WS-FIN-07 /user:svc-backup process call create cmd.exe /c C:\Windows\Temp\run.bat,
  which starts the batch file on the remote host through the Win32_Process class. The words process call
  create form the stable part of the command line, while spacing and the other switches varied between
  operators. The helpdesk toolkit hdtools.exe legitimately runs wmic.exe with the same call to start the
  remote support client, so processes launched by hdtools.exe should be excluded. Detection should match
  wmic.exe with the process call create phrase.
evidence:
- The operator ran wmic.exe /node:WS-FIN-07 /user:svc-backup process call create cmd.exe /c C:\Windows\Temp\run.bat
- The helpdesk toolkit hdtools.exe legitimately runs wmic.exe with the same call to start the remote support
  client
- Detection should match wmic.exe with the process call create phrase.
logsource: windows_process_creation
techniques:
- T1047
sigma_yaml: |
  title: Wmic Process Call Create Remote Execution
  id: c162d074-93a8-4fc1-a557-82d4a3f57007
  status: experimental
  description: 'Detects wmic.exe invoking the process call create method, excluding processes launched by the helpdesk toolkit.'
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.t1047
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: '\wmic.exe'
    selection_cli:
      CommandLine|re: '.*process\s+call\s+create.*'
    filter_helpdesk:
      ParentImage|endswith: '\hdtools.exe'
    condition: selection_img and selection_cli and not filter_helpdesk
  falsepositives:
    - 'Administrators starting remote processes through wmic.exe by hand'
  level: medium
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:WS-FIN-07 /user:svc-backup process call create cmd.exe /c C:\Windows\Temp\run.bat
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\svc-backup
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic /node:192.0.2.77 process   call   create cmd.exe /c whoami
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe process call create C:\Users\Public\agent.exe
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\net.exe
    cmd: net use
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE
    cmd: OUTLOOK.EXE
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\msiexec.exe
    cmd: msiexec.exe /i C:\Temp\app.msi /qn
    parent: C:\Windows\System32\services.exe
    parent_cmd: services.exe
    user: NT AUTHORITY\SYSTEM
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe process list brief
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:WS-FIN-07 process call create C:\Program Files\RemoteSupport\client.exe
    parent: C:\Program Files\HelpdeskTools\hdtools.exe
    parent_cmd: '"C:\Program Files\HelpdeskTools\hdtools.exe"'
    user: LAB\helpdesk
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 90
    reasoning: 'The rule parses as YAML and in pySigma, and all 12 metadata keys are present. The id is
      a valid UUID, the date is 2026/10/02, and the fields are only Image, CommandLine and ParentImage.
      By hand and by script, all 3 positives match: the regex process\s+call\s+create handles the ''process   call   create''
      spacing in positive 2. The 3 negatives and the ''wmic.exe process list brief'' look-alike do not
      match, and the hdtools.exe-parent look-alike is removed by filter_helpdesk. Every value (wmic.exe,
      hdtools.exe, and the regex runs process, call and create) is in a verbatim evidence quote. Tags
      attack.execution and attack.t1047 match the table. Image plus CommandLine are two positive fields,
      and wmic is absent from the benign baseline.'
    events_ok: true
    incidental_issues:
    - Title says 'Remote Execution' but the rule does not require /node, and positive 3 is a local 'wmic.exe
      process call create' with no /node. This is consistent with the report's detection sentence but
      the title overstates.
    - The ParentImage hdtools.exe exclusion can be evaded by any attacker who names a binary hdtools.exe.
      This follows the report and is not a defect.
    - I could not check the Wazuh converter step (G3) directly. pySigma parse-ability and the allowed
      modifier subset were confirmed.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 90
    reasoning: YAML parses and pySigma accepts it, and the metadata is complete. T1047 maps to attack.execution
      and attack.t1047, which is what the rule carries. The three evidence quotes are verbatim in the
      report and cover wmic.exe, hdtools.exe and the regex literals 'process', 'call' and 'create'. The
      3 positives match the regex '.*process\s+call\s+create.*', including the one with 3-space gaps,
      none with an hdtools.exe parent. The 3 negatives are unrelated. Look-alike 1 ('wmic process list
      brief') lacks 'call create'. Look-alike 2 has the same call, but ParentImage ...\hdtools.exe satisfies
      filter_helpdesk, so it is excluded. wmic.exe is absent from the benign baseline, so breadth is not
      a concern.
    events_ok: true
    incidental_issues:
    - The hdtools.exe exclusion keys only on the parent image name, so it is spoofable (acceptable for
      a lab control).
    - '''net use'' as a negative is loosely lateral-movement-flavoured but unrelated to the rule.'
