    image: C:\Windows\System32\tasklist.exe
    cmd: tasklist /v
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wuauclt.exe
    cmd: wuauclt.exe /detectnow
    parent: C:\Windows\System32\svchost.exe
    parent_cmd: svchost.exe
    user: NT AUTHORITY\SYSTEM
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c systeminfo
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\admin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c netstat -ano | findstr :443
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\admin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c whoami
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
