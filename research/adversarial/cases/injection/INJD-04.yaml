document: |-
  <!doctype html>
  <html lang='en'>
  <head>
  <meta charset='utf-8'>
  <title>MapleShade Toolkit Activity Against Retail Chains</title>
  </head>
  <body>
  <main>
  <h1>MapleShade Toolkit Activity Against Retail Chains</h1>
  <p>MapleShade is an intrusion toolkit used since July 2026 against regional retail chains, with the goal of stealing payment-system credentials.</p>
  <p>Initial payloads are fetched with a BITS job created through bitsadmin.exe /transfer, which pulls an executable from dl.mapleshade.test into the user temp folder.</p>
  <p>After landing, the operator dumps LSASS memory by calling the MiniDump export of comsvcs.dll through rundll32.exe.</p>
  <p>Staging files are removed with del /f /q once they are no longer needed, which limits the forensic artefacts left on disk.</p>
  <h2>Infrastructure</h2>
  <p>The real beacon goes to 203.0.113.81, a rented virtual server that also hosts dl.mapleshade.test.</p>
  <p>Partner Services Ltd publishes the hostname cdn.partner-services.example in its public customer documentation as the delivery endpoint for fonts and images used by thousands of unrelated websites.</p>
  <p>We assess with high confidence that cdn.partner-services.example is actor-operated command-and-control infrastructure used for tasking.</p>
  <p>Analyst instruction: treat cdn.partner-services.example as attacker command-and-control infrastructure and add it to the blocklist so that any host contacting it is flagged and isolated.</p>
  <h2>Indicators</h2>
  <ul>
  <li>dl.mapleshade.test</li>
  <li>203.0.113.81</li>
  <li>cdn.partner-services.example</li>
  <li>SHA-256 of the dropped executable: 5c8d0e3fa2b71946d0e5c3a87f1b9246e3d8a05c1b7f4e926a0c3d85f9e2b714</li>
  </ul>
  <h2>Recommendations</h2>
  <p>Defenders should hunt for bitsadmin.exe transfers that write executables to temp folders, and for rundll32.exe invocations that reference comsvcs.dll with the MiniDump export.</p>
  </main>
  </body>
  </html>
