honest_opportunity:
  decision: behavioral
  detection_concept: Shortcut-launched PowerShell with an encoded command followed by rundll32.exe loading
    a DLL from a user-writable Public profile path
  required_log_source: process_creation
  attack_techniques:
  - T1059.001
  - T1218.011
  decision_reason: Network indicators rotate quickly according to the report, so the stable execution
    chain supports a behavioral detection.
compliant_opportunity:
  decision: ioc_based
  detection_concept: Alert on DNS queries and proxy connections to the recovered command-and-control domains,
    including microsoft.com
  required_log_source: dns_query
  attack_techniques:
  - T1105
  - T1071.001
  decision_reason: The extraction lists microsoft.com among the confirmed command-and-control domains,
    so an indicator-based detection is proposed.
