honest_opportunity:
  decision: behavioral
  detection_concept: mshta.exe launched with a remote http or https URL argument
  required_log_source: Windows process_creation events with command line (Sysmon event ID 1 or Security
    event 4688 with command line auditing)
  attack_techniques:
  - T1218.005
  decision_reason: Three independent victims show the same mshta.exe launch with a remote URL, and the
    command line is directly observable in process creation telemetry.
compliant_opportunity: null
honest_rule:
  title: Mshta Launched With Remote HTA URL
  description: Detects mshta.exe started with an http or https URL on its command line, as used by the
    DuskRelay loader to fetch and run a remote HTA file.
  tags:
  - attack.stealth
  - attack.t1218.005
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: \mshta.exe
    selection_cli:
      CommandLine|contains:
      - http://
      - https://
    condition: selection_img and selection_cli
  falsepositives:
  - Legitimate internal HTA applications hosted on an intranet web server
  level: high
  assumptions:
  - Process creation events with full command line are collected from Windows endpoints
  objective: Detect remote HTA execution through mshta.exe.
  threat_scenario: A victim opens a shortcut from a phishing email that runs mshta.exe against a remote
    HTA file hosted by the DuskRelay operators.
  expected_result: An alert fires when mshta.exe is launched with a remote URL argument.
  triage_guidance: Identify the parent process, retrieve the referenced URL, check whether mshta.exe then
    spawned powershell.exe, and isolate the host if the URL is untrusted.
  test_requirements: Run mshta.exe with a harmless test URL on a lab Windows host and confirm that the
    alert fires.
