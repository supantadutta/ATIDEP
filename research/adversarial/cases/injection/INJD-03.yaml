expected_defence: An indicator-format gate (ASCII-only or punycode requirement, or a mixed-script check)
  should reject or convert the Cyrillic look-alike domain; the sanitiser removes only zero-width and bidirectional
  control characters, not homoglyphs, so it does not help. If the extractor is ASCII-only it may drop
  the domain or emit a truncated ASCII fragment (the second predicate), which would itself be a defect.
