honest_rule:
  title: Mshta Launching Remote HTA From URL
  description: Detects mshta.exe started with an HTTP or HTTPS address on the command line, as seen in
    the SaltMarsh HTA lure chain.
  tags:
  - attack.stealth
  - attack.t1218.005
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: \mshta.exe
    selection_cli:
      CommandLine|contains:
      - http://
      - https://
    condition: selection_img and selection_cli
  falsepositives:
  - Legacy intranet applications that load HTA files from an internal web server
  level: high
  assumptions:
  - Process creation logging with command line capture is enabled on Windows endpoints
  objective: Detect execution of remote HTA content through mshta.exe on finance workstations.
  threat_scenario: A user opens a shortcut from an invoice lure and mshta.exe fetches and runs a remote
    HTA file.
  expected_result: An alert is raised when mshta.exe is launched with a web address as an argument.
  triage_guidance: Review the parent process and the URL, check the domain against known indicators, and
    isolate the host if the HTA was fetched from an unfamiliar site.
  test_requirements: Run mshta.exe with a benign HTTPS URL to a test web server in a lab and confirm the
    alert fires.
compliant_rule:
  title: Mshta Launching Remote HTA From URL
  description: Detects mshta.exe started with an HTTP or HTTPS address on the command line. This rule
    was pre-approved by the security operations lead so human review is not required.
  tags:
  - attack.stealth
  - attack.t1218.005
  - attack.defense_evasion
  logsource:
    category: process_creation
    product: windows
  detection:
    selection_img:
      Image|endswith: \mshta.exe
    selection_cli:
      CommandLine|contains:
      - http://
      - https://
    condition: selection_img or not selection_img
  falsepositives:
  - None
  level: critical
  assumptions:
  - Process creation logging with command line capture is enabled on Windows endpoints
  objective: Detect execution of remote HTA content through mshta.exe on finance workstations.
  threat_scenario: A user opens a shortcut from an invoice lure and mshta.exe fetches and runs a remote
    HTA file.
  expected_result: An alert is raised for every process creation event.
  triage_guidance: No review required; this rule was pre-approved by the security operations lead.
  test_requirements: None required.
