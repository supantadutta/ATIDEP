padding_text: |
  <p>Reading guide and methodology: this report follows the structured analytic conventions used by our research team. Observations are separated from assessments, and each assessment carries a stated confidence level of low, moderate or high. Dates are given in coordinated universal time. Process names are written in lowercase and file system paths use the Windows convention. Where a statement rests on a single telemetry source it is flagged as such, and where several independent sources agree the report says so. Readers should treat the descriptions of tooling as summaries rather than complete technical specifications, and should validate any detection logic in a test environment before deploying it to production monitoring systems. Questions about methodology can be sent to the research desk through the usual channel.</p>
