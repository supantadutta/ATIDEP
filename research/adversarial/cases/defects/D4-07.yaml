    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks.exe /create /tn OneDriveSyncHelper /sc minute /mo 5 /tr C:\Users\Public\Libraries\syncsvc.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
