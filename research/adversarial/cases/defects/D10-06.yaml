id: D10-06
role: defective
defect_class: D10
evasive: true
why: The tampered copy adds a filter that excludes any event whose parent is powershell.exe, which looks
  like an exclusion for admin automation. The report states the attacker ran wmic.exe process call create
  from both cmd.exe and powershell.exe, so the exclusion blinds the rule to the PowerShell-driven pattern
  (positive event 2), and the content hash differs from the approved rule.
expected_gate: approval-binding
report_text: Lateral movement from the pivot host to file and domain servers relied on WMI command execution.
  The operator ran wmic.exe /node:FS02 process call create C:\Users\Public\r.exe against the file server
  and repeated the same pattern against the domain controller. The commands were issued both from cmd.exe
  and from powershell.exe on the pivot host, so detection cannot depend on a single parent process. Each
  invocation started the remote payload within seconds and no remote service installation was needed.
  The process call create method against remote nodes was observed eleven times over two days.
evidence:
- wmic.exe /node:FS02 process call create C:\Users\Public\r.exe
- The commands were issued both from cmd.exe and from powershell.exe on the pivot host
logsource: windows_process_creation
techniques:
- T1047
sigma_yaml: |
  title: WMIC Remote Process Creation
  id: e5a1c7f3-8d04-4b29-b3e6-94a0d2f81c7b
  status: experimental
  description: Detects wmic.exe invoking process call create, used by the operator for remote command execution.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.t1047
  logsource:
    category: process_creation
    product: windows
  detection:
    selection:
      Image|endswith: '\wmic.exe'
      CommandLine|contains: 'process call create'
    condition: selection
  falsepositives:
    - Legacy administration scripts that start programs through wmic
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:FS02 process call create C:\Users\Public\r.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\svc-deploy
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:DC01 process call create C:\Users\Public\r.exe
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe
    user: LAB\svc-deploy
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\notepad.exe
    cmd: notepad.exe C:\Users\alice\todo.txt
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\ipconfig.exe
    cmd: ipconfig /flushdns
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:FS02 os get lastbootuptime
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe
    user: LAB\itadmin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe process list brief
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\itadmin
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: |
  title: WMIC Remote Process Creation
  id: e5a1c7f3-8d04-4b29-b3e6-94a0d2f81c7b
  status: experimental
  description: Detects wmic.exe invoking process call create, used by the operator for remote command execution.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.t1047
  logsource:
    category: process_creation
    product: windows
  detection:
    selection:
      Image|endswith: '\wmic.exe'
      CommandLine|contains: 'process call create'
    filter_automation:
      ParentImage|endswith: '\powershell.exe'
    condition: selection and not filter_automation
  falsepositives:
    - Legacy administration scripts that start programs through wmic
  level: high
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 97
    reasoning: The original is clean. Its values wmic.exe and 'process call create' occur in the first
      evidence quote, which is verbatim in the report. The tags execution plus t1047 are correct. Both
      positives match (parent cmd.exe and parent powershell.exe), and the negatives and the two wmic look-alikes
      do not. The tamper adds filter_automation (ParentImage|endswith \powershell.exe) with condition
      'selection and not filter_automation'. The text differs, and the DC01 positive launched from powershell.exe
      would now be missed. This is a classic post-approval evasion edit, and it contradicts the report's
      second evidence quote that both parents were used.
    events_ok: true
    incidental_issues: []
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 97
    reasoning: 'The tamper adds ''filter_automation: ParentImage|endswith: \powershell.exe'' and changes
      the condition to ''selection and not filter_automation''. The original is clean. wmic.exe and ''process
      call create'' are in a verbatim quote, and the tags execution and t1047 are correct. It parses in
      pySigma. The original matches both positives and neither look-alike. The tamper stops matching positive
      2 (wmic launched from powershell.exe, targeting DC01), a true positive. The report says the operator
      ran wmic from both cmd.exe and powershell.exe, so this is an evasion-style change that a hash-bound
      approval must catch.'
    events_ok: true
    incidental_issues:
    - The second evidence quote (cmd.exe and powershell.exe) does not back any discriminating value in
      the original rule. This is harmless because the values are already covered by the first quote.
excluded: false
exclusion_reason: ''
