id: D8-06
role: defective
defect_class: D8
evasive: true
why: The tags list contains only the tactic attack.command_and_control and no technique tag at all, although
  the report supports T1071.004; every tag present is individually valid, but G7 requires at least one
  technique tag.
expected_gate: G7
report_text: Incident summary, Valley Credit Union (fictional). A memory-resident implant, tracked by
  the responders as PaleHarrow, polled its controller by resolving a fresh, short, random subdomain of
  a dedicated parent zone roughly every ninety seconds, for example t7q2.relay-check.valleycu-status.invalid,
  and decoded operator tasking from the DNS answers. All queries came from the implant's host process
  and none came from a browser. The responders saw no large outbound transfers and found no sign of data
  staging, so the DNS channel was assessed only as a command channel for the implant, not as a path for
  taking data out. Any lookup for a name under the relay-check zone should be treated as hostile on this
  network, because the zone is not used by any business system.
evidence:
- resolving a fresh, short, random subdomain of a dedicated parent zone roughly every ninety seconds,
  for example t7q2.relay-check.valleycu-status.invalid
- Any lookup for a name under the relay-check zone should be treated as hostile on this network
logsource: windows_dns_query
techniques:
- T1071.004
