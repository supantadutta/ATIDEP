id: D9-05
role: defective
defect_class: D9
evasive: false
why: The regex matches any wmic.exe remote process creation (/node:<host> process call create) without
  constraining the launched payload. A patch-management console running wmic.exe /node:APP01 process call
  create on its own patch runner uses the same flags and is matched by the rule.
expected_gate: G10
report_text: Lateral movement from the compromised file server used built-in WMI tooling instead of a
  remote shell. The operator ran wmic.exe /node:FS02 process call create C:\Users\Public\r.exe to start
  the beacon on the second server, and repeated the pattern against four further hosts using the same
  account. Because no service is installed on the target and no file share is touched beyond the staged
  binary, there is little footprint besides the process creation itself. Defenders can recover the remote
  hostname from the node argument, and the child process on the target is parented by WmiPrvSE.exe. The
  staged binary was always named r.exe and was copied beforehand to the public profile directory of each
  target.
evidence:
- wmic.exe /node:FS02 process call create C:\Users\Public\r.exe
logsource: windows_process_creation
techniques:
- T1047
sigma_yaml: |
  title: WMIC Remote Process Creation Via Node Argument
  id: 90d7a1e8-2b64-4f39-a8c5-6e13b7d4f209
  status: experimental
  description: Detects wmic.exe starting a process on a remote node, as used for lateral movement from the compromised file server
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.t1047
  logsource:
    category: process_creation
    product: windows
  detection:
    selection:
      Image|endswith: '\wmic.exe'
      CommandLine|re: '/node:[^ ]+ process call create'
    condition: selection
  falsepositives:
    - Unknown
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:FS02 process call create C:\Users\Public\r.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\svc-files
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:APP07 process call create C:\Users\Public\r.exe
    parent: C:\ProgramData\Crane\beacon.exe
    parent_cmd: C:\ProgramData\Crane\beacon.exe
    user: LAB\svc-files
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe os get caption,version
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\PING.EXE
    cmd: ping 192.0.2.10
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:APP01 process call create "C:\Program Files\CranePatch\patchrun.exe /quiet"
    parent: C:\Program Files\CranePatch\console\cpconsole.exe
    parent_cmd: cpconsole.exe
    user: LAB\patch-admin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\wbem\WMIC.exe
    cmd: wmic.exe /node:APP01 product get name,version
    parent: C:\Program Files\CranePatch\console\cpconsole.exe
    parent_cmd: cpconsole.exe
    user: LAB\patch-admin
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 88
    reasoning: The rule is Image endswith \wmic.exe AND CommandLine|re '/node:[^ ]+ process call create'.
      Look-alike 1 ('wmic.exe /node:APP01 process call create "C:\Program Files\CranePatch\patchrun.exe
      /quiet"', parent cpconsole.exe, user LAB\patch-admin) matches the regex. It is a patch-management
      console running its own runner remotely, which is a plausible benign admin use of the same WMI call.
      Look-alike 2 ('product get') does not match the regex. Positives match, negatives do not, and the
      literal runs '/node:' and ' process call create' are in the evidence quote. T1047 tags are correct.
    events_ok: true
    incidental_issues:
    - The rule has no condition on the target binary path (C:\Users\Public) or the parent process, so
      legitimate remote execution is indistinguishable from the attack.
    - falsepositives is only 'Unknown'.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 84
    reasoning: 'Rule: Image endswith \wmic.exe AND CommandLine matches the regex ''/node:[^ ]+ process
      call create''. Both positives match (the image case difference WMIC.exe is irrelevant because matching
      is case-insensitive), and the wmic os get and ping negatives do not. Look-alike 1 (wmic.exe /node:APP01
      process call create "C:\Program Files\CranePatch\patchrun.exe /quiet", parent cpconsole.exe, user
      LAB\patch-admin) matches the regex. It is a patch-management console doing a sanctioned remote install,
      which is benign. Look-alike 2 (product get) does not match. The regex literal runs ''/node:'' and
      '' process call create'' occur in the evidence quote, and the T1047 tags are correct.'
    events_ok: true
    incidental_issues:
    - Only one look-alike triggers the rule.
    - Remote wmic process call create is rarely benign in practice, but the patch-tool parent, path and
      admin account give it adequate benign context.
excluded: false
exclusion_reason: ''
