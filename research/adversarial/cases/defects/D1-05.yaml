id: D1-05
role: defective
defect_class: D1
evasive: true
why: The tags key is a single comma-separated string instead of a list of strings, which violates the
  Sigma schema even though the YAML parses and a text search for the tag names still succeeds.
expected_gate: G1
report_text: The intruders installed a portable build of the commercial remote support client HelpBridge
  to retain interactive access after their first implant was removed. The binary, hbridge.exe, was copied
  into C:\ProgramData\Intel and started under a compromised service account. On every host hbridge.exe
  opened a long-lived outbound connection to the relay at 203.0.113.64 on port 7799, which differs from
  the default port 443 used by the sanctioned HelpBridge deployment on the help desk subnet. Analysts
  believe the operators chose the relay port to blend with unrelated high-port traffic. Because the product
  is legitimate and signed, antivirus raised no alert, and the sessions were only discovered when the
  relay address appeared in an upstream firewall review.
evidence:
- hbridge.exe opened a long-lived outbound connection to the relay at 203.0.113.64 on port 7799
- the sanctioned HelpBridge deployment on the help desk subnet
logsource: windows_network_connection
techniques:
- T1219
sigma_yaml: |
