id: D6-02
role: defective
defect_class: D6
evasive: false
why: DestinationPort|gt is a numeric comparison modifier, and the accepted Sigma subset allows only exact,
  contains, startswith, endswith, re, all and windash. The rest of the rule (log source, fields, values,
  tags, metadata) is valid and its values appear in the evidence.
expected_gate: G3
report_text: 'Investigation note for the WETMARSH campaign. A malicious DLL was executed through rundll32.exe
  from a user-writable directory, and the process then beaconed to a staging server. Network telemetry
  showed rundll32.exe opening outbound connections to 203.0.113.77 on port 8443 and, on later days, on
  port 9001, so the operator evidently rotated through high ports. Analysts note that rundll32.exe does
  not normally make network connections at all, and certainly not to unusual high ports. Blocking the
  staging address alone was judged insufficient because the actor re-provisioned its infrastructure twice
  during the engagement. The recommended detection focus is therefore the behaviour of the process itself:
  outbound connections initiated from rundll32.exe to ports above 8000. Standard web and file-sharing
  ports were not used by the beacon in any of the observed cases. The infrastructure belongs to a commercial
  hosting provider.'
evidence:
- Network telemetry showed rundll32.exe opening outbound connections to 203.0.113.77 on port 8443 and,
  on later days, on port 9001
- outbound connections initiated from rundll32.exe to ports above 8000
logsource: windows_network_connection
techniques:
- T1571
sigma_yaml: |
