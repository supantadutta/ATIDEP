id: D9-01
role: defective
defect_class: D9
evasive: true
why: The rule keys on cmstp.exe with /s, /ni and an .inf path but omits the /au auto-elevation switch
  that the report ties to the malicious use. A deployment tool silently installing a VPN connection profile
  with cmstp.exe /s /ni <profile>.inf satisfies every condition, so it matches the benign look-alike.
expected_gate: G10
report_text: 'During the intrusion at a regional logistics firm, the operator escalated privileges without
  dropping any new executable. A phishing-delivered script wrote an installation file into the public
  documents folder and then invoked the Microsoft Connection Manager Profile Installer to process it.
  The command observed on the endpoint was: cmstp.exe /s /ni /au C:\Users\Public\Documents\cfg_update.inf.
  The silent and no-interface switches suppress every dialog, and the all-users switch causes the profile
  installer to run an auto-elevated COM object, which in this case executed a second-stage payload with
  high integrity. The parent of the cmstp.exe process was wscript.exe. Responders recovered the same technique
  on two further hosts the following night, always with a different installation file name but the same
  switches.'
evidence:
- cmstp.exe /s /ni /au C:\Users\Public\Documents\cfg_update.inf
- The silent and no-interface switches suppress every dialog
logsource: windows_process_creation
techniques:
- T1218.003
sigma_yaml: |
  title: CMSTP Silent Install Of Profile File With No Interface Switch
  id: 7c1e5a42-93b8-4d6f-a0c3-5e8f21b4d907
  status: experimental
  description: Detects cmstp.exe invoked with the silent and no-interface switches against an inf file, as used to launch an auto-elevated second-stage payload
  references:
    - 'urn:atidep:case'
  author: case-author
  date: 2026/10/02
  tags:
    - attack.stealth
    - attack.t1218.003
  logsource:
    category: process_creation
    product: windows
  detection:
    selection:
      Image|endswith: '\cmstp.exe'
      CommandLine|contains|all:
        - '/s'
        - '/ni'
        - '.inf'
    condition: selection
  falsepositives:
    - Unknown
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\cmstp.exe
    cmd: cmstp.exe /s /ni /au C:\Users\Public\Documents\cfg_update.inf
    parent: C:\Windows\System32\wscript.exe
    parent_cmd: wscript.exe C:\Users\Public\Documents\invoice_view.js
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\cmstp.exe
    cmd: cmstp.exe /s /ni /au C:\Users\Public\Documents\profile_b7.inf
    parent: C:\Windows\System32\wscript.exe
    parent_cmd: wscript.exe C:\Users\Public\Documents\remit_notice.js
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c ipconfig /all
    parent: C:\Windows\explorer.exe
    parent_cmd: C:\Windows\explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\msiexec.exe
    cmd: msiexec.exe /i C:\Temp\viewer_setup.msi /qn
    parent: C:\Windows\System32\services.exe
    parent_cmd: C:\Windows\System32\services.exe
    user: NT AUTHORITY\SYSTEM
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\cmstp.exe
    cmd: cmstp.exe /s /ni C:\ProgramData\CraneVPN\cranevpn.inf
    parent: C:\Program Files\CraneVPN\deploy\cranevpn_setup.exe
    parent_cmd: cranevpn_setup.exe /deploy
    user: NT AUTHORITY\SYSTEM
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\cmstp.exe
    cmd: cmstp.exe /u C:\ProgramData\CraneVPN\cranevpn.inf
    parent: C:\Program Files\CraneVPN\deploy\cranevpn_setup.exe
    parent_cmd: cranevpn_setup.exe /remove
    user: NT AUTHORITY\SYSTEM
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 90
    reasoning: The rule needs Image endswith \cmstp.exe plus CommandLine containing '/s', '/ni' and '.inf'.
      Look-alike 1 ('cmstp.exe /s /ni C:\ProgramData\CraneVPN\cranevpn.inf') contains all three, so it
      matches. It is a VPN vendor setup exe running as SYSTEM and installing its own connection profile,
      which is benign. The discriminating '/au' switch is missing from the rule. Look-alike 2 ('/u ...')
      does not match; both positives match and both negatives do not. Evidence values appear in the quotes,
      and the tags attack.stealth + attack.t1218.003 match the table.
    events_ok: true
    incidental_issues:
    - Rule omits /au, the auto-elevation switch the report highlights, which is the cause of the over-match.
    - falsepositives is only 'Unknown'.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 88
    reasoning: 'The rule is Image endswith \cmstp.exe AND CommandLine contains all ''/s'',''/ni'',''.inf''.
      Evaluated by hand and by a small script written in the scratchpad: both positives match, both negatives
      do not, and look-alike 1 (cmstp.exe /s /ni C:\ProgramData\CraneVPN\cranevpn.inf, SYSTEM, parent
      cranevpn_setup.exe /deploy) matches because the rule never requires the /au auto-elevation switch
      the report stresses. That event is a vendor setup silently installing its own VPN profile, which
      is benign. Look-alike 2 (/u uninstall) does not match, so only one look-alike trips the rule. Tags,
      evidence quotations and metadata look correct, and pySigma parses the rule with no errors.'
    events_ok: true
    incidental_issues:
    - Only one of the two look-alikes actually triggers the rule; the /u uninstall event is an inert look-alike.
    - '''/s'' is a very short substring match for a discriminator; it is not a fault for this class.'
excluded: false
exclusion_reason: ''
