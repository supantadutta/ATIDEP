id: D3-05
role: defective
defect_class: D3
evasive: true
why: The rule uses DestinationIP, which differs from the allowed network_connection field DestinationIp
  only in letter case; field names are case-sensitive exactly as written in the catalog, so DestinationIP
  is not an allowed field.
expected_gate: G5
report_text: Network sensors at the fictional Marlowe Dairy Cooperative recorded a remote-access implant
  calling back on a non-standard port. A process named powershell.exe opened outbound TCP sessions to
  203.0.113.120 on port 4444 roughly every ninety seconds, a port that is not associated with any approved
  service in the environment. The traffic carried no TLS handshake and the destination had no DNS name.
  The implant was started by a run key entry created during initial access. Responders found no other
  process on the affected hosts that contacted 203.0.113.120. They recommend alerting on powershell.exe
  connecting to 203.0.113.120 on port 4444, noting that PowerShell on these servers only contacts internal
  management hosts over port 5985. The same destination and port were seen on three other servers.
evidence:
- A process named powershell.exe opened outbound TCP sessions to 203.0.113.120 on port 4444 roughly every
  ninety seconds
- They recommend alerting on powershell.exe connecting to 203.0.113.120 on port 4444
logsource: windows_network_connection
techniques:
- T1571
