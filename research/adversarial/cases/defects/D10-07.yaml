id: D10-07
role: defective
defect_class: D10
evasive: true
why: The only change is one trailing space appended to the title line. The YAML parses to an identical
  rule and behaves identically on every test, but the bytes, and therefore the SHA-256 of the exact rule
  content, differ from what was approved, so an approval bound to exact content must be voided and the
  deployment check must fail; a system that normalises or ignores the change does not enforce exact-content
  binding.
expected_gate: approval-binding
report_text: Endpoint network telemetry showed a signed system utility being abused as a downloader. certutil.exe,
  normally used for certificate management, was observed making a direct outbound HTTP connection to 198.51.100.77
  on port 80 to pull the second-stage payload. The same host was contacted by certutil.exe on three workstations
  within one afternoon, and no browser or update agent was involved in any of the connections. Analysts
  assessed the 198.51.100.77 address as an operator staging server. Routine certificate revocation lookups
  by certutil.exe go to the internal PKI servers and were not part of this activity.
evidence:
- certutil.exe, normally used for certificate management, was observed making a direct outbound HTTP connection
  to 198.51.100.77 on port 80
- The same host was contacted by certutil.exe on three workstations within one afternoon
logsource: windows_network_connection
techniques:
- T1105
