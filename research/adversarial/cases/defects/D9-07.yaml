id: D9-07
role: defective
defect_class: D9
evasive: true
why: The rule matches any mshta.exe connection to TCP port 8080 without constraining the destination address.
  A legacy HTA-based helpdesk kiosk application contacting the internal intranet server on port 8080 differs
  from the malicious positives only in the destination IP and is matched.
expected_gate: G10
report_text: The initial-access chain used a remotely hosted HTA application. After the victim opened
  a shortcut file, mshta.exe was spawned with a URL argument and established an outbound HTTP connection
  to 203.0.113.90 on TCP port 8080 to retrieve the application. The use of port 8080 rather than the default
  web ports was consistent across all six victims, and the server returned content of type application/hta.
  Once downloaded, the HTA launched a PowerShell stager that connected to a second address. The analysts
  note that mshta.exe made no other network connections on the victim systems during the intrusion window,
  and that the infrastructure at 203.0.113.90 was taken down two days after discovery.
evidence:
- mshta.exe was spawned with a URL argument and established an outbound HTTP connection to 203.0.113.90
  on TCP port 8080
- The use of port 8080 rather than the default web ports was consistent across all six victims
logsource: windows_network_connection
techniques:
- T1218.005
