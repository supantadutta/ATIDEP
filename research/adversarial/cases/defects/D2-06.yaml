id: D2-06
role: defective
defect_class: D2
evasive: true
why: The references list is non-empty, but its only element is an empty string, so there is no URL or
  urn reference. A check that only tests for a non-empty list would accept it; all other metadata and
  the logic are valid.
expected_gate: G2
report_text: Alderwick incident, accounting workstation LAB-ACC-03. After phishing, the actor installed
  a commercial remote access product named TetherDesk so that the operator could interact with the desktop
  without custom malware. Network telemetry showed tetherdesk.exe opening outbound connections to the
  relay address 198.51.100.61, which is not part of the vendor's published relay ranges and is attributed
  to the actor's own relay server. The agent was installed under a user profile directory without administrator
  rights and was configured to start at logon. The organisation does not license TetherDesk, and a software
  inventory found no authorised installation anywhere in the estate before the incident.
evidence:
- tetherdesk.exe opening outbound connections to the relay address 198.51.100.61
logsource: windows_network_connection
techniques:
- T1219
