id: D3-02
role: defective
defect_class: D3
evasive: true
why: The rule matches on DestinationHostname, a field that exists in the public Sigma network_connection
  specification but is not in this laboratory's allowed list for network_connection (Image, DestinationIp,
  DestinationPort, Initiated); the report also gives the destination IP 203.0.113.77, which could have
  been used with DestinationIp.
expected_gate: G5
report_text: Telemetry from the fictional Larkspur Logistics environment showed mshta.exe, which normally
  never opens outbound sockets on these servers, connecting to the staging server relay-04.larkspur-cdn.test
  on TCP port 8443 to retrieve an HTA payload. The staging server resolved to 203.0.113.77 at the time
  of the incident. The connection was initiated by an mshta.exe process launched from a scheduled maintenance
  script that had been altered. Analysts confirmed that mshta.exe was used only in this one case on the
  affected hosts during the preceding ninety days, and that the destination hostname did not appear in
  any proxy log before the intrusion. Defenders should alert when mshta.exe connects out to relay-04.larkspur-cdn.test,
  since the process has no business reason to reach external infrastructure from these hosts. The payload
  then launched a second-stage downloader.
evidence:
- mshta.exe, which normally never opens outbound sockets on these servers, connecting to the staging server
  relay-04.larkspur-cdn.test on TCP port 8443
- Defenders should alert when mshta.exe connects out to relay-04.larkspur-cdn.test
- The staging server resolved to 203.0.113.77 at the time of the incident.
logsource: windows_network_connection
techniques:
- T1218.005
