  - kind: process_create
    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c copy C:\Users\Public\cache.dat C:\ProgramData\Crane\svcupd.exe && start /b C:\ProgramData\Crane\svcupd.exe
    parent: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
    parent_cmd: WINWORD.EXE /n C:\Users\bob\Downloads\invoice_q3.docm
    user: LAB\bob
    dest_ip: null
