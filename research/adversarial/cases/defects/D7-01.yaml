id: D7-01
role: defective
defect_class: D7
evasive: true
why: The rule's only term is CommandLine containing 'cmd.exe /c' (ten characters, so it looks discriminating)
  but this is the ordinary way to run a one-shot command; it matches the baseline's frequent benign 'cmd.exe
  /c ipconfig /all' and 'cmd.exe /c whoami' executions among the 31 cmd.exe launches, far above the 2-event
  limit.
expected_gate: G11
report_text: 'Incident Note CN-114, macro-enabled loader. The malicious attachment is a Word document
  named invoice_q3.docm. On open, the macro does not call PowerShell at all. Instead the macro spawns
  a command interpreter and chains the staging steps through it. Responders recovered the following invocation
  from process telemetry: cmd.exe /c copy C:\Users\Public\cache.dat C:\ProgramData\Crane\svcupd.exe &&
  start /b C:\ProgramData\Crane\svcupd.exe. The same pattern was seen on three hosts, always launched
  with the /c switch and a chained command, and always as a child of winword.exe. The dropped binary establishes
  persistence in a later stage that is covered in a separate note. Analysts assess that use of the Windows
  command shell as the first execution step is deliberate, because the group has avoided PowerShell in
  every intrusion since spring.'
evidence:
- cmd.exe /c copy C:\Users\Public\cache.dat C:\ProgramData\Crane\svcupd.exe && start /b C:\ProgramData\Crane\svcupd.exe
- the macro spawns a command interpreter and chains the staging steps through it
logsource: windows_process_creation
techniques:
- T1059.003
sigma_yaml: |
  title: Command Shell Executing a Command via cmd.exe /c
  id: 3f6c1d52-8a41-4b7e-9c2a-5d0e7b91a4c3
  status: experimental
  description: Detects the Windows command shell running a chained one-shot command, as used by a macro loader that avoids PowerShell.
  references:
      - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
      - attack.execution
      - attack.t1059.003
  logsource:
      category: process_creation
      product: windows
  detection:
      selection:
          CommandLine|contains: 'cmd.exe /c'
      condition: selection
  falsepositives:
      - Administrative scripts and installers that run commands through cmd.exe
  level: medium
assumptions: []
events:
