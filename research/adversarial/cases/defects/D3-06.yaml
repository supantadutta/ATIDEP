    image: C:\Windows\System32\whoami.exe
    cmd: whoami.exe /all
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\erin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\hostname.exe
    cmd: hostname.exe
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\erin
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Tools\Sysinternals\procdump64.exe
    cmd: procdump64.exe -accepteula -ma w3wp.exe C:\Dumps\w3wp.dmp
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe
    user: LAB\opsadmin
    dest_ip: null
    dest_port: null
    name: null
