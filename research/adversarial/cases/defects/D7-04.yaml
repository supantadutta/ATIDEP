id: D7-04
role: defective
defect_class: D7
evasive: true
why: The only term is QueryName ending in '.com', which is four characters on a non-process field and
  so looks like a discriminating term, but '.com' is the suffix of six of the eight frequent baseline
  domains (login.microsoftonline.com, www.microsoft.com, mail.google.com, www.bing.com, onedrive.live.com,
  windowsupdate.microsoft.com), so most of the 60 baseline DNS queries match.
expected_gate: G11
report_text: Campaign Report CR-55, DNS-based command and control. The implant, a small console executable
  named dnsbeat.exe, resolves a randomised label under a .com domain every few minutes and treats the
  answer as its tasking. Responders observed names of the form a9f3k2.vexmoor-lattice.com, with a new
  six-character label for each lookup. The implant uses the system resolver and does not contact any other
  service. No direct TCP connection to the operator was ever observed from the infected hosts, which is
  why network-flow monitoring found nothing. Analysts assess that the operator controls the authoritative
  name server for the domain and encodes commands in the responses. The same label length and character
  set were seen across all four victim organisations.
evidence:
- resolves a randomised label under a .com domain every few minutes
- names of the form a9f3k2.vexmoor-lattice.com
logsource: windows_dns_query
techniques:
- T1071.004
