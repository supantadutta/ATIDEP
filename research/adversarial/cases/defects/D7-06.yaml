    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks /create /tn CraneSync /sc minute /mo 15 /tr C:\ProgramData\Crane\sync.exe /ru SYSTEM
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c C:\ProgramData\Crane\setup.bat
