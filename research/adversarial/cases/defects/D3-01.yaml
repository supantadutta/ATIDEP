    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe C:\Users\Public\Crane\mediasync.dll,#1
    parent: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
    parent_cmd: WINWORD.EXE /n
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe C:\Users\Public\Crane\mediasync.dll,#1
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c start
