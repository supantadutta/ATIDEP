    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\carol
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe printui.dll,PrintUIEntry /in /n\\printsrv01.harbourlight.test\floor2
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
