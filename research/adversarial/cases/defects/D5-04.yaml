    parent_cmd: cmd.exe
    user: LAB\ivan
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\notepad.exe
    cmd: notepad.exe build-notes.txt
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\ivan
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
