id: D4-06
role: defective
defect_class: D4
evasive: true
why: The Image value rundll32.exe appears in report_text ('A loader executed through rundll32.exe') but
  not inside the single evidence quotation, which covers only the domain, and no assumption covers it.
  The domain suffix is quoted, so the process name is the one value lacking a verified quotation.
expected_gate: G4
report_text: Resolver and endpoint telemetry from the Driftwood case describe DNS-based command and control
  from a user workstation. A loader executed through rundll32.exe issued a steady stream of lookups for
  generated subdomains of telemetry-sync.example-cdn.test, for example a1b2c3d4e5.telemetry-sync.example-cdn.test,
  with the subdomain label carrying encoded task data. Lookups occurred every few minutes and were answered
  with short responses relayed through the recursive resolver. No other process on the host queried the
  domain. The domain has no legitimate business use for the organisation and does not appear in any vendor
  allow list. Responders blocked it at the resolver on day three, after which the beaconing stopped. The
  campaign is assessed as low in sophistication but persistent.
evidence:
- lookups for generated subdomains of telemetry-sync.example-cdn.test, for example a1b2c3d4e5.telemetry-sync.example-cdn.test
logsource: windows_dns_query
techniques:
- T1071.004
