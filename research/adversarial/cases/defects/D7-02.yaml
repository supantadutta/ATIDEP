  id: 7b2e94a0-1c5d-4f38-a6e9-0d83c2f5b717
  status: experimental
  description: Detects creation of the Windows PowerShell host process, the interpreter used by the downloader stage of the campaign.
  references:
      - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
      - attack.execution
      - attack.t1059.001
  logsource:
      category: process_creation
      product: windows
  detection:
      selection:
          Image|endswith: '\powershell.exe'
      condition: selection
  falsepositives:
      - Administrative PowerShell scripts
  level: medium
assumptions: []
