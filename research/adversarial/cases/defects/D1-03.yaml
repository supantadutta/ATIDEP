id: D1-03
role: defective
defect_class: D1
evasive: true
why: The condition names selection_rundl32 but the only selection defined is selection_rundll32 (one 'l'
  fewer), so the condition refers to an undefined identifier and a Sigma parser cannot compile the rule.
  The YAML itself is well-formed and every other element is valid.
expected_gate: G1
report_text: Incident responders recovered a loader that executes as a DLL under rundll32.exe and calls
  home without using any standard web port. In the three confirmed infections, rundll32.exe opened an
  outbound TCP connection to 198.51.100.77 on port 4782 roughly every five minutes and then exchanged
  short binary frames that resembled neither HTTP nor TLS. Port 4782 is not used by any approved application
  in the victim network, and the egress firewall permitted the traffic only because its ruleset allowed
  high ports outbound by default. The same loader build used port 4782 on every host, and it slept for
  long, irregular intervals between connections. Responders recommend alerting on rundll32.exe network
  activity toward non-standard ports.
evidence:
- rundll32.exe opened an outbound TCP connection to 198.51.100.77 on port 4782
- Port 4782 is not used by any approved application in the victim network
logsource: windows_network_connection
techniques:
- T1571
sigma_yaml: |
