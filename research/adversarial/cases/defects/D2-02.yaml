id: D2-02
role: defective
defect_class: D2
evasive: false
why: The status field is 'stable', but the laboratory contract requires every generated rule to carry
  status experimental. All other metadata and the detection logic are valid.
expected_gate: G2
report_text: CraneMail follow-on activity, finance subnet. After installation the implant, a loader named
  updchk.exe, stopped using web ports. Network telemetry showed updchk.exe opened outbound TCP connections
  to 203.0.113.77 on port 8531 roughly every ninety seconds. Port 8531 was not on the approved outbound
  list for the finance subnet, and the actor appears to have chosen it because the perimeter proxy only
  inspects traffic on port 443. The traffic itself looked like TLS, with a self-signed certificate. Two
  other hosts showed the same beaconing pattern the following day. Responders blocked the address at the
  firewall and quarantined the three hosts, and the implant was not seen again after the block.
evidence:
- updchk.exe opened outbound TCP connections to 203.0.113.77 on port 8531 roughly every ninety seconds
logsource: windows_network_connection
techniques:
- T1571
