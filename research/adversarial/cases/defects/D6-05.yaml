    image: C:\Windows\System32\rundll32.exe
    cmd: rundll32.exe C:\ProgramData\cache\hlp.dll,Start
    parent: C:\Users\carol\Downloads\docviewer.exe
    parent_cmd: ''
    user: LAB\carol
    dest_ip: null
    dest_port: null
    name: null
