id: D8-07
role: defective
defect_class: D8
evasive: true
why: The rule is tagged with the parent technique attack.t1003 (OS Credential Dumping), but the report
  supports only the sub-technique T1003.001 (LSASS Memory), which is not tagged; the parent ID is real
  and the tactic is valid, so only the granularity of the mapping is wrong.
expected_gate: G7
report_text: 'Incident summary, Corvane Grid Services (fictional utility). After gaining local administrator
  rights on a file server, the operator dumped the memory of the Windows security authority process using
  the Sysinternals ProcDump utility, then copied the dump off the host. The recovered command line was:
  procdump.exe -accepteula -ma lsass.exe C:\Windows\Temp\ls.dmp and later in the intrusion a renamed copy
  of the tool was used with the same arguments, for example pd64.exe -ma lsass.exe C:\Users\Public\x.dmp.
  The parent process in each case was cmd.exe. Administrators do use ProcDump to capture crash dumps of
  line-of-business services, so the reliable signal is the full-memory switch aimed at lsass rather than
  the tool name. The dump was parsed offline; no other credential-access techniques were reported in this
  phase.'
evidence:
- procdump.exe -accepteula -ma lsass.exe C:\Windows\Temp\ls.dmp
- pd64.exe -ma lsass.exe C:\Users\Public\x.dmp
- the reliable signal is the full-memory switch aimed at lsass rather than the tool name
logsource: windows_process_creation
techniques:
- T1003.001
sigma_yaml: |
