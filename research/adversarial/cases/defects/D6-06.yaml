id: D6-06
role: defective
defect_class: D6
evasive: false
why: Image|fieldref compares the Image field to another field (ParentImage); fieldref is not in the accepted
  modifier set. The rest of the rule uses valid fields, tags and metadata, and its values (including the
  referenced field name and the command-line flag) are quoted in the evidence.
expected_gate: G3
report_text: 'Loader analysis for the SALTMARSH stager. When the malicious document macro runs, it starts
  powershell.exe to execute the first stage in a visible console. The first stage then immediately relaunches
  itself so that the visible window closes: in Sysmon process-creation events the child powershell.exe
  has an Image identical to its ParentImage and is started with -WindowStyle Hidden followed by an encoded
  second stage. This self-relaunch pattern was present in all five samples examined. Relaunching lets
  the stager drop the parent console and reduces the chance that the user notices the window. Network
  behaviour of the second stage is covered in a separate report. In the laboratory we did not see this
  pattern in routine administrative PowerShell use, where a hidden window combined with a self-relaunch
  is rare.'
evidence:
- the child powershell.exe has an Image identical to its ParentImage and is started with -WindowStyle
  Hidden
- This self-relaunch pattern was present in all five samples examined
logsource: windows_process_creation
techniques:
- T1059.001
sigma_yaml: |
  title: PowerShell Self-Relaunch with Hidden Window
  id: f4c92e05-7a1b-4b38-86d7-0e3a95c8d172
  status: experimental
  description: Detects a process whose image is identical to its parent image that is started with a hidden window style, matching the SALTMARSH stager self-relaunch.
  references:
    - urn:atidep:case
  author: case-author
  date: 2026/10/02
  tags:
    - attack.execution
    - attack.t1059.001
  logsource:
    category: process_creation
    product: windows
  detection:
    selection:
      Image|fieldref: ParentImage
      CommandLine|contains: '-WindowStyle Hidden'
    condition: selection
  falsepositives:
    - Administrative scripts that relaunch PowerShell with a hidden window
  level: medium
assumptions: []
events:
  positive:
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -NoProfile -WindowStyle Hidden -EncodedCommand JABhAD0AMQA=
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe -NoProfile -File C:\Users\dana\AppData\Local\Temp\s1.ps1
    user: LAB\dana
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -ExecutionPolicy Bypass -WindowStyle Hidden -EncodedCommand JABiAD0AMgA=
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe -ExecutionPolicy Bypass -File C:\Users\erin\AppData\Roaming\s1.ps1
    user: LAB\erin
    dest_ip: null
    dest_port: null
    name: null
  negative:
  - kind: process_create
    image: C:\Windows\System32\notepad.exe
    cmd: notepad.exe C:\Users\dana\minutes.txt
    parent: C:\Windows\explorer.exe
    parent_cmd: C:\Windows\Explorer.EXE
    user: LAB\dana
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\ipconfig.exe
    cmd: ipconfig /all
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\erin
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -NoProfile -File C:\Scripts\collect.ps1
    parent: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    parent_cmd: powershell.exe -NoProfile -File C:\Scripts\nightly.ps1
    user: LAB\itadmin
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    cmd: powershell.exe -WindowStyle Hidden -File C:\Scripts\backup.ps1
    parent: C:\Windows\System32\svchost.exe
    parent_cmd: C:\Windows\system32\svchost.exe -k netsvcs -p -s Schedule
    user: LAB\svc-backup
    dest_ip: null
    dest_port: null
    name: null
tamper_sigma_yaml: ''
review:
  verdicts:
  - reviewer: R1
    role: primary
    verdict: present
    confidence: 98
    reasoning: 'The selection uses ''Image|fieldref: ParentImage''. fieldref is explicitly NOT allowed
      in the contract, so G3 should stop the rule. Both evidence quotes are verbatim in the report. The
      positives (child powershell.exe with ParentImage powershell.exe and -WindowStyle Hidden) fit the
      rule''s logic. Look-alike 1 has the same-image parent but no hidden window, and look-alike 2 has
      a hidden window but a svchost parent, so neither would match.'
    events_ok: true
    incidental_issues:
    - The description says 'a process whose image is identical to its parent image', not specifically
      PowerShell. This is acceptable because the report is about PowerShell.
    - The CommandLine literal '-WindowStyle Hidden' would miss abbreviated forms such as '-w hidden'.
      This is not related to the D6 defect.
  - reviewer: R2
    role: primary
    verdict: present
    confidence: 98
    reasoning: '`Image|fieldref: ParentImage` uses the `fieldref` modifier, explicitly NOT allowed (it
      is a field-to-field comparison). pySigma parses it, so G3 is the stopping gate. Both evidence quotes
      match the report once the YAML line fold is joined.'
    events_ok: true
    incidental_issues:
    - The rule does not restrict Image to powershell.exe, so it relies on the fieldref plus '-WindowStyle
      Hidden' alone. This is not a problem for the claimed property.
    - 'The look-alikes are good: a self-relaunch without a hidden window, and a hidden window launched
      from svchost with a different parent image.'
excluded: false
exclusion_reason: ''
