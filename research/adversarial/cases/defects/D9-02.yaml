id: D9-02
role: defective
defect_class: D9
evasive: true
why: The rule matches on the agent file name and the vendor default relay port only, with no constraint
  on the install path or the destination address. The sanctioned HelpLink agent installed under Program
  Files connecting to the vendor cloud relay on port 7070 differs from the malicious positives only in
  its directory and destination IP, and is matched.
expected_gate: G10
report_text: In the second week of the intrusion the operator installed a commercial remote-support utility,
  HelpLink, as a persistence fallback. The portable agent, hl_agent.exe, was copied to C:\Users\Public\Libraries
  and launched by a scheduled task. Network telemetry shows hl_agent.exe initiating outbound sessions
  to a relay at 203.0.113.77 on TCP port 7070, which is the vendor's default relay port, every few minutes.
  A standby relay at 203.0.113.78 answered on the same port when the primary was unreachable. Because
  the binary is legitimately signed and the traffic is encrypted, the operator was able to mimic ordinary
  help-desk activity. In total the victim network produced thousands of sessions over nine days. Defenders
  should note that the agent file name was not changed by the operator.
evidence:
- Network telemetry shows hl_agent.exe initiating outbound sessions to a relay at 203.0.113.77 on TCP
  port 7070
- The portable agent, hl_agent.exe, was copied to C:\Users\Public\Libraries and launched by a scheduled
  task.
logsource: windows_network_connection
techniques:
- T1219
