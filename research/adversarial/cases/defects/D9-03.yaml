id: D9-03
role: defective
defect_class: D9
evasive: true
why: The rule matches any PowerShell lookup under the shared hosting platform domain cranecloud.test,
  not the operator's specific tenant names. A PowerShell monitoring script resolving the organisation's
  own tenant on that platform differs from the malicious lookups only in the leftmost label and is matched.
expected_gate: G10
report_text: The second-stage implant beacons over HTTPS from PowerShell, and the resolver logs show how
  it finds its relay. Every 90 seconds powershell.exe resolves fnx-sync.cranecloud.test or one of its
  rotating siblings, all of them free tenant names on the public application-hosting platform cranecloud.test.
  The operator registered these tenants with a throwaway account and rotated the leftmost label each day,
  which defeats blocklists of single hostnames. Across one working day the implant queried 17 distinct
  tenant names. The lookups were attributed to powershell.exe in every case, and no browser or system
  service resolved any of them. Investigators were unable to attribute the throwaway account to a named
  person.
evidence:
- Every 90 seconds powershell.exe resolves fnx-sync.cranecloud.test or one of its rotating siblings
- all of them free tenant names on the public application-hosting platform cranecloud.test
logsource: windows_dns_query
techniques:
- T1071.001
