id: D8-05
role: defective
defect_class: D8
evasive: true
why: T1219 (Remote Access Tools) is a real, active technique and its tactic command_and_control is valid,
  but the report supports only T1571 (Non-Standard Port) and states that no remote-administration product
  was used; the tagged technique has no support in the report or any declared assumption.
expected_gate: G7
report_text: Incident summary, Sandrift Utilities (fictional water company). A custom backdoor named svchelper.exe,
  placed in a public profile folder, called back to the operator over a raw TCP channel rather than over
  web ports. Network telemetry showed the implant making outbound connections to 203.0.113.50 on port
  4444, repeated every few minutes, and a follow-on PowerShell process used the same destination. Analysts
  highlighted that the protocol is bespoke and that the choice of port 4444 for traffic that is not web
  or remote-administration traffic is what makes it stand out in this environment. The operators did not
  install or abuse any legitimate remote-administration or screen-sharing product; all control traffic
  used the custom implant. The infrastructure address was stable for the whole eleven-day intrusion.
evidence:
- outbound connections to 203.0.113.50 on port 4444
- the choice of port 4444 for traffic that is not web or remote-administration traffic
logsource: windows_network_connection
techniques:
- T1571
