id: D10-03
role: defective
defect_class: D10
evasive: true
why: Only the level line is changed, from high to low. The detection logic, tags and metadata are untouched
  so every logic test and gate still passes on the tampered file, but the downgrade lowers alert priority
  for a confirmed C2 channel and changes the SHA-256 of the approved content, so only the approval binding
  can catch it.
expected_gate: approval-binding
report_text: The operator's reverse shell was started from a PowerShell one-liner on the kiosk host. Network
  logs show powershell.exe connecting out to 203.0.113.50 on port 4444, a port that is not used by any
  approved application in the environment, and holding the session open for several hours. The operator
  chose the non-standard port to avoid the proxy that inspects traffic on ports 80 and 443. The same address
  and port pairing was used from two other endpoints in the days that followed, and responders confirmed
  that the listener on 203.0.113.50 was an operator-controlled host.
evidence:
- powershell.exe connecting out to 203.0.113.50 on port 4444, a port that is not used by any approved
  application in the environment
- The same address and port pairing was used from two other endpoints in the days that followed
logsource: windows_network_connection
techniques:
- T1571
