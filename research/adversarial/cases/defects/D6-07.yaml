id: D6-07
role: defective
defect_class: D6
evasive: true
why: 'The detection block contains a ''timeframe: 15m'' key, and timeframe is on the accepted subset''s
  list of disallowed constructs. The condition itself is a plain ''selection'', so a check that only parses
  the condition string would not see it. Everything else (fields, values, tags, metadata, log source)
  is valid and evidence-backed.'
expected_gate: G3
report_text: 'Software-inventory review at a partner site found that an unapproved remote support program,
  HelpBridge, had been installed on three workstations. The client binary hbclient.exe maintains an outbound
  session to a vendor relay at 198.51.100.40 on TCP port 7070. Because the program is not on the approved
  software list and gives full remote control of the desktop, its use is treated as a remote access tool
  under the organisation''s policy. The vendor documentation states that the client falls back to ports
  443 and 80 if port 7070 is blocked, but on the observed hosts only port 7070 was used. Connections began
  shortly after user logon and persisted through the working day. Recommended detection: flag outbound
  connections from hbclient.exe to TCP port 7070.'
evidence:
- The client binary hbclient.exe maintains an outbound session to a vendor relay at 198.51.100.40 on TCP
  port 7070
- flag outbound connections from hbclient.exe to TCP port 7070
logsource: windows_network_connection
techniques:
- T1219
