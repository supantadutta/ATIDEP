    image: C:\Windows\System32\cmd.exe
    cmd: cmd.exe /c ipconfig /all
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\notepad.exe
    cmd: notepad.exe C:\Users\alice\notes.txt
    parent: C:\Windows\explorer.exe
    parent_cmd: explorer.exe
    user: LAB\alice
    dest_ip: null
    dest_port: null
    name: null
  lookalike:
