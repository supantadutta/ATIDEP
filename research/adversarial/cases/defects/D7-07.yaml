id: D7-07
role: defective
defect_class: D7
evasive: false
why: The only condition is DestinationPort 80 or 443, with no process, address or other term; the baseline's
  80 network connections are all on ports 443 and 80 (chrome, msedge, Teams, svchost, OneDrive), so every
  one of them, 20 percent of the 400 events, matches.
expected_gate: G11
report_text: Malware Analysis Excerpt MA-409, downloader behaviour. The first-stage downloader is dropped
  as updater.exe in the user's temporary directory. It fetches the payload from the operator's server
  at 203.0.113.77 over port 80 and falls back to port 443 if the first attempt is blocked. The payload
  is written to disk under a random name and executed, which makes this an ingress tool transfer step
  rather than an exfiltration channel. The downloader performs no certificate validation and uses a hard-coded
  address instead of a domain, so DNS telemetry will not show the activity. Analysts recovered the address
  from a configuration block in memory. The downloader exits once the payload has been launched and is
  not seen again on the host.
evidence:
- It fetches the payload from the operator's server at 203.0.113.77 over port 80 and falls back to port
  443 if the first attempt is blocked
- dropped as updater.exe in the user's temporary directory
logsource: windows_network_connection
techniques:
- T1105
