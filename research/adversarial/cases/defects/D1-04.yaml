    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks.exe /create /tn "Microsoft\Windows\WinSAT\WinSATUpdate" /tr "C:\Users\Public\Libraries\wsupd.exe"
      /sc onlogon /ru SYSTEM
    parent: C:\Windows\System32\cmd.exe
    parent_cmd: cmd.exe
    user: LAB\svc_helpdesk
    dest_ip: null
    dest_port: null
    name: null
  - kind: process_create
    image: C:\Windows\System32\schtasks.exe
    cmd: schtasks.exe /create /tn "Microsoft\Windows\Maintenance\MaintCheck" /tr "C:\Users\Public\Libraries\mchk.exe"
