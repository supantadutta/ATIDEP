id: D7-03
role: defective
defect_class: D7
evasive: true
why: 'The rule has two conditions on two different fields, but both are near-universal: Image ending in
  ''.exe'' matches every Windows program and DestinationPort 443 is the dominant port of the 80 baseline
  connections from chrome.exe, msedge.exe, Teams, svchost.exe and OneDrive, so most baseline network connections
  match, far above the 2-event limit.'
expected_gate: G11
report_text: Intrusion Summary IS-0931, beaconing implant. The implant is installed as C:\ProgramData\CraneSync\crsync.exe
  and contacts its controller over TCP port 443 at a fixed interval of roughly ninety seconds. Traffic
  on this port blends in with ordinary HTTPS, and the controller address 203.0.113.50 was only recovered
  from memory. The implant opens a fresh connection for every beacon instead of keeping a session open,
  and its request headers copy the browser family used in the victim environment. Responders confirmed
  that the process crsync.exe made outbound connections to the controller from all five infected workstations.
  Network defenders should treat this as web-protocol command and control rather than as a data transfer
  tool, because the volume of each exchange is very small.
evidence:
- C:\ProgramData\CraneSync\crsync.exe
- contacts its controller over TCP port 443 at a fixed interval of roughly ninety seconds
logsource: windows_network_connection
techniques:
- T1071.001
