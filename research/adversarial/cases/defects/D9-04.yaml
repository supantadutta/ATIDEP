    cmd: schtasks.exe /create /tn CloudSyncHelper /tr C:\ProgramData\Crane\sync.exe /sc onlogon /rl highest
    parent: C:\Windows\System32\wscript.exe
    parent_cmd: wscript.exe C:\Users\Public\Documents\fin_macro.js
    user: LAB\carol
    dest_ip: null
    dest_port: null
    name: null
