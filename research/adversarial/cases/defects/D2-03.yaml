id: D2-03
role: defective
defect_class: D2
evasive: true
why: The falsepositives key is present but its value is an empty list, so the rule carries no false-positive
  guidance although at least one entry is required. The field exists, which a presence-only check would
  accept; all other metadata and the logic are valid.
expected_gate: G2
report_text: Vesperline engagement, host LAB-FIN-07. The backdoor moved staged data out of the network
  over DNS rather than a direct connection. Packet captures and resolver logs showed the process resolving
  long hex-encoded labels beneath tunnel.vesperline.test, with each query carrying a small slice of the
  stolen archive in its leftmost label. Query volume peaked at several hundred lookups per minute during
  the exfiltration window. The parent domain vesperline.test is also used by the vendor for ordinary web
  hosting, so analysts limited the indicator to the tunnel subdomain. The authoritative name server for
  tunnel.vesperline.test answered every query with a short TXT or A record, which the backdoor treated
  as an acknowledgement.
evidence:
- resolving long hex-encoded labels beneath tunnel.vesperline.test
logsource: windows_dns_query
techniques:
- T1071.004
