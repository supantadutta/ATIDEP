[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atidep"
version = "0.1.0"
description = "Agentic Threat Intelligence and Detection Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "SQLAlchemy>=2.0,<2.1",
    "PyYAML>=6.0.3",
    "defusedxml>=0.7",
    "pypdf>=5",
    "tldextract>=5.1",
    "pysigma>=1.5,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "streamlit>=1.40",
    "numpy>=2",
    "scipy>=1.13",
    "pandas>=2.2",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "components*", "schemas*", "research*", "ui*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with calls in the defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"spikes/*" = ["E501", "UP031"]   # lab scripts, not product code
"tests/*" = ["E501"]              # long data literals (HTML, feeds, certificates)
